<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícono original del portal: tres bloques apilados y una estrella. Todo dentro de la zona segura (máscara de Android). -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a3dff"/><stop offset="1" stop-color="#2a1585"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <circle cx="256" cy="256" r="190" fill="#ffffff" opacity=".08"/>
  <g transform="translate(256 280) scale(1.22) translate(-256 -280)">
  <!-- bloque de abajo a la izquierda (naranjo) -->
  <g transform="translate(184 330)">
    <path d="M0 0 L-72 -42 L0 -84 L72 -42 Z" fill="#ffb15c"/>
    <path d="M0 0 L-72 -42 L-72 42 L0 84 Z" fill="#ff8a1f"/>
    <path d="M0 0 L72 -42 L72 42 L0 84 Z" fill="#d9640a"/>
  </g>
  <!-- bloque de abajo a la derecha (celeste) -->
  <g transform="translate(328 330)">
    <path d="M0 0 L-72 -42 L0 -84 L72 -42 Z" fill="#8be6ff"/>
    <path d="M0 0 L-72 -42 L-72 42 L0 84 Z" fill="#1fc8f0"/>
    <path d="M0 0 L72 -42 L72 42 L0 84 Z" fill="#0e93c2"/>
  </g>
  <!-- bloque de arriba (rosado) -->
  <g transform="translate(256 246)">
    <path d="M0 0 L-72 -42 L0 -84 L72 -42 Z" fill="#ff9cc6"/>
    <path d="M0 0 L-72 -42 L-72 42 L0 84 Z" fill="#ff4f9a"/>
    <path d="M0 0 L72 -42 L72 42 L0 84 Z" fill="#d42f76"/>
  </g>
  <!-- estrella sobre el bloque de arriba -->
  <path transform="translate(256 205) scale(1.15 .62)" d="M0 -44 L12 -14 L44 -13 L19 7 L28 38 L0 20 L-28 38 L-19 7 L-44 -13 L-12 -14 Z" fill="#ffe14d" stroke="#fff6c2" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- destellos -->
  <path d="M120 150 l7 -18 l7 18 l18 7 l-18 7 l-7 18 l-7 -18 l-18 -7 Z" fill="#ffe14d"/>
  <path d="M380 128 l5 -13 l5 13 l13 5 l-13 5 l-5 13 l-5 -13 l-13 -5 Z" fill="#ffffff"/>
</svg>
