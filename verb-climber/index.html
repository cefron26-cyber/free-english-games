<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<title>Verb Climber</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1B2A5A;

<body>
<canvas id="screen"></canvas>
<script>
'use strict';

/* =====================================================================
   VERB CLIMBER — juego de plataformas para repasar verbos en inglés
   (presente / pasado). Un solo archivo, sin librerías.
   Secciones: CONFIGURACIÓN · VERBOS · UTILIDADES · ASSETS · FUENTE ·
   PANTALLA · ENTRADA · SONIDO · EFECTOS · NIVEL · FÍSICA · MAREA ·
   ALERTAS · GAMIFICACIÓN · HUD · PANTALLAS · BUCLE
   ===================================================================== */

// ===================== CONFIGURACIÓN =====================
const DEBUG = false;              // Depuración: hitboxes, objetivo, marea. Teclas 1-6 fuerzan alertas/efectos
const SHOW_TARGET_HUD = true;     // Mostrar el objetivo (PAST / PRESENT) en el HUD. false = más difícil
const SCREEN_SHAKE = true;        // Sacudidas de pantalla en errores y alertas
const USE_ALPHABET_SPRITES = false; // Poner en true cuando existan alfabeto.png + alfabeto_atlas.json

// --- Pantalla ---
const VIRTUAL_W = 192;            // Ancho virtual en píxeles de pixel art
const MIN_VIRTUAL_H = 256;        // Alto virtual mínimo (en horizontal se reduce la escala para respetarlo)

const MAX_VIRTUAL_H = 600;        // Alto virtual máximo (tabletas muy altas)
const INT_SCALE_MAX_MARGIN = 0;   // 0 = llenar siempre la pantalla. >0: usar escala entera si el margen sobrante es menor (p. ej. 0.12)
const BUTTON_DP = 100;            // Alto aproximado de los botones táctiles (dp)
const BUTTON_MARGIN_DP = 12;      // Margen alrededor de los botones (dp)
const BUTTON_GAP_DP = 10;         // Separación entre ← y → (dp)
const WALL = 6;                   // Grosor de las paredes laterales (px virtuales)
const HUD_H = 36;                // Alto de la barra del HUD

// --- Física (px virtuales y segundos) ---
const MAX_VX = 90;                // Velocidad horizontal máxima
const ACCEL = 320;                // Aceleración en el suelo
const FRICTION = 160;             // Desaceleración al soltar (hielo: resbala ≈ 20 px)

const GRAVITY = 600;              // Gravedad
const JUMP_V = 310;               // Velocidad inicial de salto (altura ≈ 80 px: una fila, no dos; ≈ 68 px de alcance horizontal)

const ROW_APPEAR_T = 0.35;        // Duración de la animación al aparecer una fila nueva

const DEATH_POP = 230;            // Última vida: salto hacia arriba antes de caer de lado (px/s)

const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const R = Math.round;
function easeOutBack(k) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); }
function easeOutBounce(k) {
  const n = 7.5625, d = 2.75;
  if (k < 1 / d) return n * k * k;
  if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75;
  if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + 0.9375;
  return n * (k -= 2.625 / d) * k + 0.984375;
}

function frameOf(name) { return ATLAS.frames[name]; }
// Dibuja un frame del atlas en (dx,dy) con tamaño (dw,dh); flip = espejo horizontal
function drawFrame(c, name, dx, dy, dw, dh, flip) {
  const f = frameOf(name); if (!f) return;
  dw = dw == null ? f.w : dw; dh = dh == null ? f.h : dh;
  dx = R(dx); dy = R(dy); dw = R(dw); dh = R(dh);
  const img = CHAR_FRAMES.has(name) ? charSheet() : SHEET;
  if (flip) {
    c.save(); c.translate(dx + dw, dy); c.scale(-1, 1);
    c.drawImage(img, f.x, f.y, f.w, f.h, 0, 0, dw, dh); c.restore();
  } else c.drawImage(img, f.x, f.y, f.w, f.h, dx, dy, dw, dh);
}
// Personaje anclado abajo al centro, con squash & stretch (sx, sy)
function drawChar(c, name, cx, by, sx = 1, sy = 1, flip = false) {
  const w = R(24 * sx), h = R(24 * sy);
  drawFrame(c, name, cx - w / 2, by + CHAR_SINK - h, w, h, flip);
}
// Caminar provisional: alterna idle_0 / idle_1 a 8 fps con rebote de 1 px. Reemplazar por un ciclo real.
function drawWalk(c, cx, by, t, flip, sx = 1, sy = 1, scared = false) {
  const f = Math.floor(t * 8) % 2;
  const name = scared ? 'face_asustado' : (f ? 'idle_1' : 'idle_0');
  drawChar(c, name, cx, by - f, sx, sy, flip);
}

function pixCanvas(rows, over) {
  const h = rows.length, w = rows[0].length;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const ch = rows[j][i]; if (ch === '.') continue;
    const col = (over && over[ch]) || PAL[ch]; if (!col) continue;

}

  input.right = keys.right || touchBtn.right;
  input.jump = keys.jump || touchBtn.jump;
}
function onJumpPressed() { if (state === 'play' && player) player.jumpBuf = JUMP_BUFFER; }
function controlsActive() { return state === 'play'; }

function updateTouchButtons() {
  const nb = { left: false, right: false, jump: false };
  if (controlsActive()) {
    for (const p of pointers.values()) {
      if (p.y < ctrl.panelY - 20 * dpr) continue; // solo dentro del panel de controles (con margen)
      if (p.x < ctrl.split1) nb.left = true;
      else if (p.x < ctrl.split2) nb.right = true;
      else nb.jump = true;
    }
  }
  for (const k of ['left', 'right', 'jump']) {
    if (nb[k] && !touchBtn[k]) { vibrate(10); if (k === 'jump') onJumpPressed(); }
    touchBtn[k] = nb[k];
  }
  syncInput();
}

function firstInteraction() {
  initAudio();
  if (firstInteractionDone) return;
  firstInteractionDone = true;
  const el = document.documentElement;
  try {
    const rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rq && !document.fullscreenElement) {
      const pr = rq.call(el, { navigationUI: 'hide' });
      const lock = () => { try { const o = screen.orientation; if (o && o.lock) o.lock('portrait').catch(() => {}); } catch (e) { /* no soportado */ } };
      if (pr && pr.then) pr.then(lock).catch(() => {}); else lock();
    }
  } catch (e) { /* sin pantalla completa */ }
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault(); lastInputTouch = e.pointerType === 'touch'; firstInteraction();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* nada */ }
  const px = e.clientX * dpr, py = e.clientY * dpr;
  pointers.set(e.pointerId, { x: px, y: py });
  updateTouchButtons();
  if (state === 'shop' && py >= ctrl.panelY) { shopCode(px < ctrl.split1 ? 'left' : px < ctrl.split2 ? 'right' : 'jump'); return; }
  if (py < ctrl.panelY || !controlsActive()) uiPointerDown(e.pointerId, px, py);
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  e.preventDefault();
  pointers.set(e.pointerId, { x: e.clientX * dpr, y: e.clientY * dpr });
  updateTouchButtons(); uiPointerMove(e.pointerId, e.clientX * dpr, e.clientY * dpr);
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId); updateTouchButtons();
  uiPointerUp(e.pointerId, e.clientX * dpr, e.clientY * dpr, e.type === 'pointerup');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('lostpointercapture', endPointer);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => { // rueda del ratón: desplaza la tienda
  if (state !== 'shop') return;
  e.preventDefault(); shop.scroll = clamp(shop.scroll + e.deltaY * 0.25, 0, shopLayout().max);
}, { passive: false });

const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', Space: 'jump', KeyW: 'jump' };
window.addEventListener('keydown', (e) => {
  lastInputTouch = false; firstInteraction();
  const k = KEYMAP[e.code];
  if (k) {
    e.preventDefault();
    if (state === 'shop') { if (!e.repeat) shopCode(k); return; }
    if (state === 'modes' && k !== 'jump') { if (!e.repeat) modeKey(k); return; }
    if (!keys[k] && k === 'jump') onJumpPressed();
    keys[k] = true; syncInput();
    if (k === 'jump' && state !== 'play' && !e.repeat) uiKeyConfirm();
    return;
  }
  if (e.repeat) return;
  if (e.code === 'Enter') uiKeyConfirm();
  if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'play') pauseGame(); else if (state === 'pause') resumeGame(); }
  if (e.code === 'KeyM') toggleSfx();
  if (e.code === 'KeyN') toggleMusic();
  if (DEBUG && state === 'play') debugKey(e.code);
});

const midiF = (m) => 440 * Math.pow(2, (m - 69) / 12);

  s.connect(fl); fl.connect(g); g.connect(sfxGain); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.03);
}
const COMBO_NOTES = [72, 74, 76, 79, 81, 84, 86, 88, 91, 93, 96]; // do, re, mi, sol, la…

};

  72, 76, 79, 76, 72, 76, 79, 84,   71, 74, 79, 74, 71, 74, 79, 83,
  69, 72, 76, 72, 69, 72, 76, 81,   77, 76, 74, 72, 74, 0, 67, 0,

function startMusic() { if (!actx || music.on) return; music.on = true; music.nextT = actx.currentTime + 0.05; }

function updateMusic() {
  if (!actx || !music.on || musicMuted || actx.state !== 'running') { if (actx) music.nextT = actx.currentTime + 0.05; return; }

    if (m) toneAt(music.nextT, midiF(m), eighth * 0.9, 'square', 0.16, 0, musicGain);
    if (i % 2 === 0) toneAt(music.nextT, midiF(MUSIC_BASS[i / 2]), eighth * 1.8, 'triangle', 0.35, 0, musicGain);

// Partículas reutilizadas (pool fijo)
const particles = []; for (let i = 0; i < MAX_PARTICLES; i++) particles.push({ on: false });
let pCursor = 0;
function spawnP(type, x, y, vx, vy, life, color, size = 1, g = 0) {
  let p = null;
  for (let i = 0; i < MAX_PARTICLES; i++) { const q = particles[(pCursor + i) % MAX_PARTICLES]; if (!q.on) { p = q; pCursor = (pCursor + i + 1) % MAX_PARTICLES; break; } }
  if (!p) { p = particles[pCursor]; pCursor = (pCursor + 1) % MAX_PARTICLES; }
  p.on = true; p.type = type; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.max = life; p.color = color;
  p.size = size; p.g = g; p.rot = 0; p.rotT = 0; p.sx = 0; p.sy = 0; p.ph = Math.random() * 6;
  return p;
}
function updateParticles(dt) {
  for (const p of particles) {
    if (!p.on) continue;
    p.life -= dt; if (p.life <= 0) { p.on = false; continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'confetti' || p.type === 'mote') p.x += Math.sin(p.ph + p.life * 8) * (p.type === 'mote' ? 0.15 : 0.4);
    if (p.type === 'chunk') { p.rotT += dt; if (p.rotT > 0.08) { p.rotT = 0; p.rot = (p.rot + (p.vx > 0 ? 1 : 3)) % 4; } }
  }
}
function drawParticles(c, camY) {
  for (const p of particles) {
    if (!p.on) continue;
    const x = R(p.x), y = R(p.y - camY);
    if (y < -10 || y > VH + 10) continue;
    if (p.type === 'chunk') {
      c.save(); c.translate(x, y); c.rotate(p.rot * Math.PI / 2);
      c.drawImage(SHEET, p.sx, p.sy, 6, 6, -3, -3, 6, 6); c.restore();
      continue;
    }
    const k = p.life / p.max;
    if ((p.type === 'frost' || p.type === 'spark') && k < 0.4 && Math.floor(p.life * 30) % 2) continue; // desvanecer con parpadeo pixel
    if (p.type === 'mote') { c.globalAlpha = Math.min(1, k * 1.6); c.fillStyle = p.color; c.fillRect(x, y, p.size, p.size); c.globalAlpha = 1; continue; } // se desvanece suave
    c.fillStyle = p.color; c.fillRect(x, y, p.size, p.size);
  }
}
function burst(type, x, y, n, colors, spd, life, g, size = 1, up = 0) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.6);
    spawnP(type, x, y, Math.cos(a) * v, Math.sin(a) * v - up, life * (0.6 + Math.random() * 0.4), pick(colors), size, g);
  }
}

// Números y textos flotantes
const floaters = []; for (let i = 0; i < MAX_FLOATERS; i++) floaters.push({ on: false });
function floatText(text, x, y, color = PAL.Y, sc = 1, life = 0.9) {
  let f = floaters.find((q) => !q.on) || floaters[0];
  f.on = true; f.text = text; f.x = x; f.y = y; f.t = 0; f.life = life; f.color = color; f.sc = sc;
}
function updateFloaters(dt) { for (const f of floaters) if (f.on) { f.t += dt; f.y -= 22 * dt; if (f.t > f.life) f.on = false; } }
function drawFloaters(c, camY) {
  for (const f of floaters) {
    if (!f.on) continue;

    const pop = f.t < 0.1 ? f.sc + 1 : f.sc;
    let x = f.x; const w = measureWord(f.text, pop);

// Copos de nieve del fondo
const snow = []; for (let i = 0; i < SNOWFLAKES; i++) snow.push({ x: Math.random() * VIRTUAL_W, y: Math.random() * 400, spd: rand(6, 16), ph: Math.random() * 6, s: Math.random() < 0.25 ? 2 : 1 });
let snowCamY = 0;
function updateSnow(dt, camY) {
  const dc = camY - snowCamY; snowCamY = camY;
  for (const f of snow) {
    f.y += f.spd * dt - dc * 0.5 * (f.s === 2 ? 1.2 : 0.7);
    f.x += Math.sin(globalT * 1.2 + f.ph) * 4 * dt;
    if (f.y > VH + 4) { f.y -= VH + 8; f.x = Math.random() * VW; }
    if (f.y < -4) f.y += VH + 8;
    if (f.x < 0) f.x += VW; if (f.x > VW) f.x -= VW;
  }
}
function drawSnow(c) { c.fillStyle = PAL.W; for (const f of snow) c.fillRect(R(f.x), R(f.y), f.s, f.s); }

// Sacudida de pantalla
const shake = { t: 0, mag: 0 };
function addShake(mag, t) { if (!SCREEN_SHAKE) return; shake.mag = Math.max(shake.mag, mag); shake.t = Math.max(shake.t, t); }

// Transición con barrido en pixel art

function updateTransition(dt) {
  if (!trans) return;
  trans.t += dt;
  if (trans.phase === 'cover' && trans.t >= TRANS_T) { trans.next(); trans.phase = 'reveal'; trans.t = 0; }
  else if (trans.phase === 'reveal' && trans.t >= TRANS_T) trans = null;
}
function drawTransition(c) {
  if (!trans) return;
  const k = trans.phase === 'cover' ? trans.t / TRANS_T : 1 - trans.t / TRANS_T;
  const B = 12, cols = Math.ceil(VW / B), rows = Math.ceil(VH / B);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const d = (i + j * 0.7) / (cols + rows * 0.7);
    const amt = clamp((k * 1.35 - d) * 4, 0, 1);
    if (amt <= 0) continue;
    const s = Math.ceil(B * amt / 2) * 2, o = (B - s) / 2;
    c.fillStyle = PAL.N; c.fillRect(i * B + o, j * B + o, s, s);
    if (amt < 1) { c.fillStyle = PAL.D; c.fillRect(i * B + o, j * B + o, s, 1); }
  }
}

let G = null;       // estado de la partida
let player = null;
let state = 'loading', screenT = 0, globalT = 0;

function tileWidth(text) { return Math.max(MIN_TILE_W, measureWord(text) + TILE_PAD); }
function hgap(a, b) { return Math.max(0, Math.max(a.x, b.x) - Math.min(a.x + a.w, b.x + b.w)); }

// Lista de verbos del modo de la partida y clave de repaso (regular: el presente; otros modos: "modo:base")
function modeList() { return MODES[G.mode].list; }
function weakKey(i) { const v = modeList()[i]; return G.mode === 'regular' ? v.present : G.mode + ':' + v.base; }
function pickPair(exclude) {
  const list = modeList(), free = [];
  for (let i = 0; i < list.length; i++) if (!G.visiblePairs.has(i) && !exclude.has(i)) free.push(i);
  // Repaso: los verbos fallados en partidas anteriores salen más seguido
  const weak = free.filter((i) => saveData.weak[weakKey(i)]);
  if (weak.length && Math.random() < WEAK_CHANCE) return pick(weak);
  if (free.length) return pick(free);
  return randInt(0, list.length - 1);
}

function makePlat(x, y, pair, form, row) {
  const text = VERBS[pair][form];
  return { x, y, w: tileWidth(text), pair, form, text: text.toUpperCase(), row,
    kind: Math.random() < SNOW_TILE_CHANCE ? 'nieve' : 'normal', used: false, state: 'ok', crackT: 0, glowT: 0, fish: null, floor: false };
}

// Fila de respaldo: 3 casillas repartidas a lo ancho con formas alternadas (X, Y, X).
// Cualquier casilla de la fila anterior queda cerca de dos casillas vecinas de formas distintas.
function forcedLayout(y) {
  const interior = VW - WALL * 2, exclude = new Set(), pairs = [];
  const short = [];
  for (let i = 0; i < VERBS.length; i++) if (!G.visiblePairs.has(i) && tileWidth(VERBS[i].present) <= 44 && tileWidth(VERBS[i].past) <= 44) short.push(i);
  for (let i = 0; i < 3; i++) { const free = short.filter((p) => !exclude.has(p)); const p = free.length ? pick(free) : pickPair(exclude); exclude.add(p); pairs.push(p); }
  const a = Math.random() < 0.5 ? 'past' : 'present', b = a === 'past' ? 'present' : 'past';
  const forms = [a, b, a];
  const widths = pairs.map((p, i) => tileWidth(VERBS[p][forms[i]]));
  // La del centro (ancha, centrada) se alcanza desde ambos extremos; las laterales llegan hasta 24 px de ella
  widths[1] = Math.max(widths[1], 48);
  const cx = R(VW / 2 - widths[1] / 2);
  widths[0] = Math.max(widths[0], cx - 24 - WALL);
  widths[2] = Math.max(widths[2], VW - WALL - (cx + widths[1] + 24));
  void interior;
  const xs = [WALL, cx, VW - WALL - widths[2]];
  return pairs.map((p, i) => { const pl = makePlat(xs[i], y, p, forms[i], null); pl.w = widths[i]; return pl; });
}
function reachScore(plats, prevPlats) {
  let score = 0;
  for (const a of prevPlats) for (const f of ['present', 'past']) if (plats.some((b) => b.form === f && hgap(a, b) <= REACH_X)) score++;
  return score;
}

// Genera una fila. Desde CADA casilla de la fila anterior se puede llegar a una casilla en PRESENTE
// y a otra en PASADO (así siempre hay una correcta alcanzable, aunque cambie el objetivo).
// SIMPLE/CONTINUOUS: casilla con texto propio; ok = es la forma correcta. form 'ok'/'bad' para que el resto del código la trate como casilla de verbo
function makeModePlat(x, y, pair, text, ok) {
  return { x, y, w: tileWidth(text), pair, form: ok ? 'ok' : 'bad', ok, text: text.toUpperCase(), row: null,
    kind: Math.random() < SNOW_TILE_CHANCE ? 'nieve' : 'normal', used: false, state: 'ok', crackT: 0, glowT: 0, fish: null, floor: false };
}
// Fila de SIMPLE/CONTINUOUS: UNA pregunta (un verbo) con 3 casillas: la correcta y 2 distractores, desordenadas.
// La correcta debe alcanzarse desde donde el jugador puede estar parado: la correcta de la fila anterior (o el piso).
// NO desde las incorrectas (se rompen al pisarlas): exigirlo dejaba la correcta casi siempre en el centro.
// El lugar de la correcta (izquierda, centro, derecha) se sortea primero; si no se alcanza desde ahí, se prueba otro.
// Si nada funciona, la correcta va ancha en el centro.
function genModeRow(y, prev) {
  const interior = VW - WALL * 2, list = modeList();
  const prevPlats = prev ? prev.plats.filter((p) => p.state !== 'broken' && (p.floor || p.ok)) : [];
  const exclude = new Set();
  let pair = -1, texts = null, widths = null;
  for (let k = 0; k < 20; k++) { // un verbo cuyas 3 formas quepan
    pair = pickPair(exclude); exclude.add(pair);
    const v = list[pair]; texts = [v.ok, v.wrong[0], v.wrong[1]];
    widths = texts.map(tileWidth);
    if (widths[0] + widths[1] + widths[2] + MODE_GAP_MIN * 2 <= interior) break;
  }
  const v = list[pair], reachAll = (plats) => prevPlats.every((a) => plats.some((b) => b.ok && hgap(a, b) <= REACH_X));
  let best = null;
  // los costados se sortean más (40 % c/u) porque el centro también es el lugar de reserva cuando un costado no se alcanza
  const pickSlot = () => { const rr = Math.random(); return rr < MODE_SIDE_CHANCE ? 0 : rr < MODE_SIDE_CHANCE * 2 ? 2 : 1; };
  let first = pickSlot();
  if (prev && prev.okSlot === first && Math.random() < MODE_REPEAT_AVOID) while (first === prev.okSlot) first = pickSlot(); // que no se repita mucho el mismo lugar
  const slots = [first, (first + 1 + randInt(0, 1)) % 3]; slots.push(3 - slots[0] - slots[1]);
  for (let attempt = 0; attempt < 60 && !best; attempt++) {
    const slot = slots[Math.floor(attempt / 20)], d = Math.random() < 0.5 ? [1, 2] : [2, 1]; // 20 intentos por lugar
    const order = slot === 0 ? [0, d[0], d[1]] : slot === 1 ? [d[0], 0, d[1]] : [d[0], d[1], 0];
    const free = interior - widths[0] - widths[1] - widths[2];
    const g1 = randInt(MODE_GAP_MIN, Math.max(MODE_GAP_MIN, Math.min(GAP_MAX, free - MODE_GAP_MIN)));
    const g2 = randInt(MODE_GAP_MIN, Math.max(MODE_GAP_MIN, Math.min(GAP_MAX, free - g1)));
    let x = WALL + randInt(0, Math.max(0, free - g1 - g2));
    const plats = order.map((o, i) => { const pl = makeModePlat(x, y, pair, texts[o], o === 0); x += widths[o] + (i === 0 ? g1 : g2); return pl; });
    if (reachAll(plats)) best = plats;
  }
  if (!best) { // respaldo: distractores pegados a las paredes y la correcta ancha y centrada
    const side = Math.random() < 0.5 ? [1, 2] : [2, 1];
    const wl = widths[side[0]], wr = widths[side[1]];
    const wm = Math.max(widths[0], Math.min(56, interior - wl - wr - MODE_GAP_MIN * 2));
    const mx = R(WALL + wl + (interior - wl - wr - wm) / 2);
    best = [makeModePlat(WALL, y, pair, texts[side[0]], false), makeModePlat(mx, y, pair, texts[0], true), makeModePlat(VW - WALL - wr, y, pair, texts[side[1]], false)];
    best[1].w = wm;
  }
  const row = { y, plats: best, i: prev ? prev.i + 1 : 1, spawnT: 0, base: v.base, ok: v.ok,
    okSlot: [...best].sort((a, b) => a.x - b.x).findIndex((p) => p.ok) }; // 0 izquierda, 1 centro, 2 derecha
  for (const p of best) p.row = row;
  G.visiblePairs.add(pair);
  if (Math.random() < FISH_CHANCE) { const p = pick(best); p.fish = { t: Math.random() * 6 }; }
  return row;
}

function genRow(y, prev) {
  if (G.mode !== 'regular') return genModeRow(y, prev);
  const interior = VW - WALL * 2;
  const prevPlats = prev ? prev.plats.filter((p) => p.state !== 'broken') : [];
  let best = null, bestScore = -1;
  for (let attempt = 0; attempt < 80; attempt++) {
    let n = Math.random() < THREE_TILE_CHANCE ? 3 : 2;
    const exclude = new Set(), pairs = [];
    for (let i = 0; i < n; i++) { const p = pickPair(exclude); exclude.add(p); pairs.push(p); }
    const forms = [];
    for (let i = 0; i < n; i++) forms.push(Math.random() < 0.5 ? 'present' : 'past');
    if (!forms.includes('present')) forms[randInt(0, n - 1)] = 'present';
    if (!forms.includes('past')) { let i = forms.indexOf('present'); if (n === 3) i = randInt(0, 2); forms[i] = 'past'; if (!forms.includes('present')) forms[(i + 1) % n] = 'present'; }
    let widths = pairs.map((p, i) => tileWidth(VERBS[p][forms[i]]));
    let gaps = []; for (let i = 0; i < n - 1; i++) gaps.push(randInt(GAP_MIN, GAP_MAX));
    let total = widths.reduce((a, b) => a + b, 0) + gaps.reduce((a, b) => a + b, 0);
    // si no cabe, reduce huecos al mínimo; si aún no cabe, prueba otra combinación
    if (total > interior) { gaps = gaps.map(() => GAP_MIN); total = widths.reduce((a, b) => a + b, 0) + GAP_MIN * (n - 1); }
    if (total > interior) continue;
    let x = WALL + randInt(0, interior - total);
    const plats = [];
    for (let i = 0; i < n; i++) { const pl = makePlat(x, y, pairs[i], forms[i], null); pl.w = widths[i]; plats.push(pl); x += widths[i] + (gaps[i] || 0); }
    const score = reachScore(plats, prevPlats);
    if (score > bestScore) { bestScore = score; best = plats; }
    if (score >= prevPlats.length * 2) break;
  }
  if (!best || bestScore < prevPlats.length * 2) best = forcedLayout(y);
  const row = { y, plats: best, i: prev ? prev.i + 1 : 1, spawnT: 0 };
  for (const p of best) { p.row = row; G.visiblePairs.add(p.pair); }
  if (Math.random() < FISH_CHANCE) { const p = pick(best); p.fish = { t: Math.random() * 6 }; }
  return row;
}

function makeFloorRow(y) {
  const row = { y, plats: [], i: 0, spawnT: ROW_APPEAR_T };
  const fl = { x: WALL, y, w: VW - WALL * 2, pair: -1, form: '', text: 'START', row, kind: 'nieve', used: true, state: 'ok', crackT: 0, glowT: 0, fish: null, floor: true };
  row.plats.push(fl); return row;
}

// Mantiene ROWS_ON_SCREEN filas: la más alta alcanzada + las de arriba. Al subir a una fila nueva aparece una más.
function updateRows(initial = false) {
  let top = G.rows[G.rows.length - 1];
  while (top.i < G.reached + ROWS_ON_SCREEN - 1) {
    const r = genRow(top.y - ROW_GAP, top);
    if (initial) r.spawnT = -0.12 * r.i; // al empezar, las filas caen una tras otra
    else { burst('snow', VW / 2, r.y - 2, 10, [PAL.W, PAL.L], 60, 0.5, 60); SFX.rowAppear(); }
    G.rows.push(r); top = r;
  }
  // borrar filas muy por debajo (y liberar sus verbos)
  while (G.rows.length > 2 && G.rows[0].y > Math.max(G.tideY + 60, G.camY + VH + 60)) {
    const r = G.rows.shift(); for (const p of r.plats) if (p.pair >= 0) G.visiblePairs.delete(p.pair);
  }
}

function updatePlatforms(dt) {
  for (const row of G.rows) if (row.spawnT < ROW_APPEAR_T) row.spawnT += dt;
  for (const row of G.rows) for (const pl of row.plats) {
    if (pl.glowT > 0) pl.glowT -= dt;
    if (pl.fish) pl.fish.t += dt;
    if (pl.state === 'crack') {
      pl.crackT -= dt;
      if (pl.crackT <= 0) breakPlat(pl);
    }
  }
}
function breakPlat(pl) {
  pl.state = 'broken';
  const f = frameOf('ice_agrietado');
  const n = Math.min(14, Math.ceil(pl.w / 6) * 2);
  for (let i = 0; i < n; i++) {
    const p = spawnP('chunk', pl.x + rand(3, pl.w - 3), pl.y + rand(2, 14), rand(-50, 50), rand(-90, -20), rand(0.8, 1.3), PAL.I, 1, 420);
    p.sx = f.x + randInt(0, 26); p.sy = f.y + randInt(0, 20);
  }
  burst('frost', pl.x + pl.w / 2, pl.y + 6, 10, [PAL.W, PAL.L], 60, 0.5, 200);
  SFX.crack(); addShake(2, 0.15);
  if (player.ground === pl) { player.onGround = false; player.ground = null; player.vy = 0; }
}

// Dibujo de casilla con 9-slice horizontal (0–12 | 13 repetida | 14–31)
function drawSlice(c, name, x, y, w) {
  const f = frameOf(name); x = R(x); y = R(y);
  const mid = Math.max(0, w - 31);
  c.drawImage(SHEET, f.x, f.y, 13, f.h, x, y, 13, f.h);
  if (mid > 0) c.drawImage(SHEET, f.x + 13, f.y, 1, f.h, x + 13, y, mid, f.h);
  c.drawImage(SHEET, f.x + 14, f.y, 18, f.h, x + 13 + mid, y, 18, f.h);
}
// Posición en pantalla de una casilla (con la caída al aparecer); null si no se ve
function platScreenY(pl, camY) {
  if (pl.state === 'broken') return null;
  const st = pl.row ? pl.row.spawnT : ROW_APPEAR_T;
  if (st <= 0) return null; // fila aún por aparecer
  let y = pl.y - camY;
  if (st < ROW_APPEAR_T) y -= R(24 * (1 - easeOutBounce(st / ROW_APPEAR_T))); // cae desde arriba con rebote
  return y > VH || y < -34 ? null : y;
}
// Sombra de la casilla sobre el fondo (luz desde arriba a la izquierda)
function drawPlatformShadow(c, pl, camY) {
  const y = platScreenY(pl, camY); if (y == null || pl.floor) return;
  const x = R(pl.x), yy = R(y);
  c.fillStyle = 'rgba(5,10,35,0.28)'; c.fillRect(x + 3, yy + 32, pl.w - 2, 2); c.fillRect(x + pl.w, yy + 4, 2, 30);
}
// Brillos del hielo: cada casilla tiene su propio dibujo (semilla al azar). En el cuerpo (filas 11-23 del sprite;
// en la de nieve, 18-23) puede tapar el brillo fijo del sprite y poner otros: rayas diagonales, burbujas y estrellitas
const ICE_BODY = { normal: [11, 23], nieve: [18, 23] };
function iceMarks(pl) {
  if (pl.gl) return pl.gl;
  const r = Math.random, w = pl.w, marks = [];
  const n = 1 + Math.floor(r() * 3);
  for (let i = 0; i < n; i++) {
    const t = r();
    marks.push({ type: t < 0.5 ? 'streak' : t < 0.8 ? 'bubbles' : 'star', x: 4 + Math.floor(r() * Math.max(1, w - 14)), len: 4 + Math.floor(r() * 5), dbl: r() < 0.5, ph: r() * 6 });
  }
  pl.gl = { hide: pl.kind === 'normal' && r() < 0.5, marks, sweep: r() * 7, dash: 6 + Math.floor(r() * Math.max(1, w - 14)) };
  return pl.gl;
}
function drawIceMarks(c, pl, x, y) {
  const g = iceMarks(pl), body = ICE_BODY[pl.kind] || ICE_BODY.normal, x0 = R(x), y0 = R(y);
  if (g.hide) { c.fillStyle = PAL.I; c.fillRect(x0 + 2, y0 + 11, 11, 11); } // tapa el brillo fijo del sprite
  for (const m of g.marks) {
    const mx = x0 + m.x;
    if (m.type === 'streak') { // raya diagonal "/" que se afina hacia abajo
      const top = body[0] + 1, len = Math.min(m.len, body[1] - top - 1);
      for (let i = 0; i < len; i++) { c.fillStyle = PAL.W; c.fillRect(mx + len - i, y0 + top + i, i < len - 2 ? 2 : 1, 1); }
      if (m.dbl) { c.fillStyle = PAL.L; for (let i = 0; i < len - 2; i++) c.fillRect(mx + len - i + 4, y0 + top + 1 + i, 1, 1); }
    } else if (m.type === 'bubbles') { // burbujas de aire atrapadas
      c.fillStyle = PAL.L; c.fillRect(mx, y0 + body[1] - 1, 1, 1); c.fillRect(mx + 3, y0 + body[1] - 3, 1, 1);
      c.fillStyle = PAL.W; c.fillRect(mx + 1, y0 + body[1] - 5, 1, 1);
    } else if (Math.sin(globalT * 2.2 + m.ph) > 0.6) { // estrellita que titila
      const sy = y0 + body[0] + 3;
      c.fillStyle = PAL.W; c.fillRect(mx, sy, 1, 1); c.fillRect(mx - 1, sy, 3, 1); c.fillRect(mx, sy - 1, 1, 3);
    }
  }
  c.fillStyle = PAL.L; c.fillRect(x0 + g.dash, y0 + 26, 3, 1); // segunda rayita de luz en la franja de abajo
  // destello que cruza la casilla cada ~7 s (franja diagonal clara)
  const k = (globalT + g.sweep) % 7;
  if (k < 0.45) {
    const sx = x0 - 12 + (pl.w + 24) * (k / 0.45);
    c.save(); c.beginPath(); c.rect(x0 + 1, y0 + 1, pl.w - 2, 23); c.clip();
    c.fillStyle = 'rgba(255,255,255,0.55)';
    for (let i = 0; i < 24; i++) c.fillRect(R(sx - i * 0.6), y0 + 1 + i, 3, 1);
    c.restore();
  }
}
function drawPlatform(c, pl, camY) {
  let y = platScreenY(pl, camY); if (y == null) return;
  let x = pl.x;
  const name = pl.state === 'crack' ? 'ice_agrietado' : (pl.kind === 'nieve' ? 'ice_nieve' : 'ice_normal');
  if (pl.state === 'crack') { x += randInt(-1, 1); y += randInt(-1, 1); }
  drawSlice(c, name, x, y, pl.w);
  if (pl.state !== 'crack' && !pl.floor) drawIceMarks(c, pl, x, y);
  const band = (ATLAS.text_band && ATLAS.text_band[name]) || [1, 9];
  const ty = y + band[0] + Math.floor((band[1] - band[0] + 1 - FONT_H) / 2);
  drawWord(pl.text, x + pl.w / 2, ty, 1, pl.state === 'crack' ? PAL.r : PAL.N, 'center', c);
  if (pl.glowT > 0 && Math.floor(pl.glowT * 20) % 2 === 0) { c.fillStyle = 'rgba(255,255,255,0.55)'; c.fillRect(R(x), R(y), pl.w, 12); }
  if (pl.used && !pl.floor) {
    c.fillStyle = PAL.Y; c.fillRect(R(x) + 2, R(y), pl.w - 4, 1); // brillo permanente
    c.drawImage(SPR.check, R(x) + pl.w - 6, R(y) - 4);
    if (Math.floor(globalT * 2 + pl.x) % 5 === 0) { c.fillStyle = PAL.W; c.fillRect(R(x) + 3, R(y) - 1, 1, 1); }
  }
  if (pl.fish) drawFish(c, x + pl.w / 2 - 4, y - 13, pl.fish.t, pl.x > VW / 2);
}

function drawWalls(c, camY) {
  for (const side of [0, 1]) {
    const x0 = side ? VW - WALL : 0;
    c.fillStyle = PAL.c; c.fillRect(x0, 0, WALL, VH);
    c.fillStyle = PAL.L; c.fillRect(side ? VW - 1 : 0, 0, 1, VH);
    c.fillStyle = PAL.D; c.fillRect(side ? x0 : WALL - 1, 0, 1, VH);
    c.fillStyle = PAL.I;
    const off2 = ((-camY) % 12 + 12) % 12;
    for (let y = off2 - 12; y < VH; y += 12) { c.fillRect(x0 + (side ? 1 : 0), R(y), WALL - 1, 1); c.fillRect(x0 + ((Math.floor((y - off2) / 12) % 2) ? 2 : 4), R(y) - 6, 1, 6); }
  }
}

// ===================== FÍSICA =====================
function newPlayer(x, y) {
  return { x, y, vx: 0, vy: 0, onGround: true, ground: null, coyote: 0, jumpBuf: 0, jumpCut: true, facing: 1,
    sqT: 0, sqDur: 0.1, sqKind: '', celebrateT: 0, invuln: 0, dead: false, deadT: 0, walkT: 0, slideT: 0, airT: 0,
    hurtT: 0, dying: false, dyingT: 0, poof: false };
}
function overlapX(px, pl) { return px + HITBOX_W / 2 > pl.x + 2 && px - HITBOX_W / 2 < pl.x + pl.w - 2; }

function updatePlayer(dt) {
  const p = player;
  p.jumpBuf -= dt; if (p.sqT > 0) p.sqT -= dt; if (p.celebrateT > 0) p.celebrateT -= dt; if (p.invuln > 0) p.invuln -= dt;
  if (p.hurtT > 0) p.hurtT -= dt;
  if (p.dying) { // muerte final: salta, cae de lado atravesando todo y desaparece en humo
    p.dyingT += dt;
    if (!p.poof) { p.vy += GRAVITY * dt; p.y += p.vy * dt; }
    if (!p.poof && p.dyingT > DEATH_POOF_T) {
      p.poof = true; SFX.poof();
      burst('frost', p.x, p.y - 12, 26, ['#FFFFFF', '#DCDDE8', '#AEB0C4'], 60, 0.8, -25, 2);
      burst('frost', p.x, p.y - 12, 16, ['#FFFFFF', '#DCDDE8'], 30, 1, -15, 3);
    }
    return;
  }
  if (p.dead) {
    p.deadT += dt; p.y += 16 * dt;
    if (p.deadT > 1.1 && G.lives > 0 && G.endT < 0) respawn();
    return;
  }
  const dir = (input.left ? -1 : 0) + (input.right ? 1 : 0);
  if (dir) p.facing = dir;
  const ctl = p.onGround ? 1 : AIR_CONTROL;
  if (dir) p.vx = approach(p.vx, dir * MAX_VX, (Math.sign(p.vx) === -dir ? ACCEL + FRICTION : ACCEL) * ctl * dt);
  else p.vx = approach(p.vx, 0, FRICTION * ctl * dt);

  // Salto (coyote + búfer)
  if (p.onGround) p.coyote = COYOTE_TIME; else p.coyote -= dt;
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = -JUMP_V; p.onGround = false; p.ground = null; p.coyote = 0; p.jumpBuf = 0; p.jumpCut = false;
    p.sqKind = 'jump'; p.sqT = p.sqDur = 0.18; SFX.jump();
    burst('snow', p.x, p.y, 4, [PAL.W, PAL.L], 30, 0.3, 80);
    for (const s of [-1, 1]) for (let i = 0; i < 3; i++) spawnP('frost', p.x + s * rand(2, 5), p.y - 1, s * rand(20, 45), rand(-12, -4), rand(0.25, 0.4), pick([PAL.W, PAL.L]), 1, 40);
  }
  if (VARIABLE_JUMP && !input.jump && p.vy < 0 && !p.jumpCut) { p.vy *= JUMP_CUT; p.jumpCut = true; }
  if (!p.onGround) { p.vy = Math.min(p.vy + GRAVITY * dt, MAX_FALL); p.airT += dt; } else p.airT = 0;

  // Horizontal + paredes
  p.x += p.vx * dt;
  const half = HITBOX_W / 2;
  if (p.x - half < WALL) { p.x = WALL + half; p.vx = 0; }
  if (p.x + half > VW - WALL) { p.x = VW - WALL - half; p.vx = 0; }
  // El hielo resbala, pero nunca lo tira solo por el borde
  if (p.onGround && p.ground && !dir) {
    const g = p.ground;
    if (p.x < g.x + 1) { p.x = g.x + 1; p.vx = 0; }
    if (p.x > g.x + g.w - 1) { p.x = g.x + g.w - 1; p.vx = 0; }
  }

  // Escarcha y siseo al resbalar
  if (p.onGround && !dir && Math.abs(p.vx) > 15) {
    if (p.slideT <= 0) SFX.slide();
    p.slideT += dt;
    if (Math.random() < 0.6) spawnP('frost', p.x - Math.sign(p.vx) * 5 + rand(-1, 1), p.y - 1, 0, 0, 0.45, Math.random() < 0.5 ? PAL.W : PAL.L);
  } else p.slideT = 0;
  if (p.onGround && dir) p.walkT += dt; else p.walkT = 0;

  // Vertical + plataformas de un solo sentido
  const prevY = p.y;
  if (p.onGround) {
    const g = p.ground;
    if (!g || g.state === 'broken' || !overlapX(p.x, g)) { p.onGround = false; p.ground = null; }
    else { p.y = g.y; p.vy = 0; }
  }
  if (!p.onGround) {
    p.y += p.vy * dt;
    if (p.vy >= 0) {
      let hit = null;
      for (const row of G.rows) {
        if (row.y < prevY - 0.01 || row.y > p.y) continue;
        for (const pl of row.plats) if (pl.state !== 'broken' && overlapX(p.x, pl) && (!hit || pl.y < hit.y)) hit = pl;
      }
      if (hit) land(hit);
    }
  }
}

function land(pl) {
  const p = player, impact = p.vy;
  p.onGround = true; p.ground = pl; p.y = pl.y; p.vy = 0;
  if (pl.row && pl.row.i > G.reached && !(pl.form && !formOk(pl) && !pl.used)) G.reached = pl.row.i; // fila nueva (no cuenta si es incorrecta)
  if (impact > 60) {
    p.sqKind = 'land'; p.sqT = p.sqDur = 0.14; SFX.land();
    burst('snow', p.x, p.y - 1, 6, [PAL.W, PAL.L, PAL.c], 35, 0.4, 120, 1, 20);
    // nubecitas de nieve hacia los lados, más grandes cuanto más fuerte la caída
    const n = impact > 200 ? 5 : 3;
    for (const s of [-1, 1]) for (let i = 0; i < n; i++) spawnP('frost', p.x + s * rand(3, 7), p.y - rand(1, 3), s * rand(25, 60), rand(-18, -6), rand(0.3, 0.5), pick([PAL.W, PAL.L, PAL.c]), Math.random() < 0.35 ? 2 : 1, 50);
  }
  evaluate(pl);
  applyPendingTarget(); // si el mensaje terminó en el aire, el nuevo objetivo vale DESPUÉS de esta casilla (se juzga con el del salto)
}

function respawn() {
  const p = player;
  G.tideY += TIDE_DROP;
  let best = null;
  for (const row of G.rows) for (const pl of row.plats) {
    if (pl.state !== 'ok') continue;
    if (pl.y > G.tideY - 28 || pl.y < G.camY + HUD_H + 26 || pl.y > G.camY + VH - 6) continue;
    const safe = pl.used || pl.floor || formOk(pl);
    if (safe && (!best || pl.y > best.y)) best = pl;
  }
  if (!best) { // sin opción ideal: la casilla más baja visible, marcada como segura
    for (const row of G.rows) for (const pl of row.plats) if (pl.state === 'ok' && pl.y < G.tideY - 20 && pl.y > G.camY + HUD_H && (!best || pl.y > best.y)) best = pl;
    if (best) best.used = true;
  }
  if (!best) { best = G.rows[G.rows.length - 1].plats[0]; best.used = true; }
  p.dead = false; p.deadT = 0; p.x = best.x + best.w / 2; p.y = best.y; p.vx = 0; p.vy = 0;
  p.onGround = true; p.ground = best; p.invuln = RESPAWN_INVULN;
  burst('spark', p.x, p.y - 12, 12, [PAL.W, PAL.Y, PAL.L], 50, 0.5, 0);
}

function updateTide(dt) {

// fishBank = peces para gastar en la tienda (totalFish solo cuenta, para el logro)
let saveData = { best: 0, games: 0, totalFish: 0, fishBank: null, skin: 'default', skins: {}, ach: {}, weak: {}, sfxMuted: false, musicMuted: false };
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) saveData = Object.assign(saveData, s); } catch (e) { /* sin almacenamiento */ }
  saveData.ach = saveData.ach || {}; saveData.weak = saveData.weak || {}; saveData.skins = saveData.skins || {};
  if (saveData.fishBank == null) saveData.fishBank = saveData.totalFish || 0; // los peces ya pescados cuentan para la tienda
  if (!SKINS.some((s) => s.id === saveData.skin)) saveData.skin = 'default';
  sfxMuted = !!saveData.sfxMuted; musicMuted = !!saveData.musicMuted;
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch (e) { /* sin almacenamiento */ } }
function unlock(id) {
  if (saveData.ach[id]) return;
  if (G && G.mode !== 'regular') return; // los logros solo cuentan en REGULAR
  const a = ACHIEVEMENTS.find((q) => q.id === id); if (!a) return;
  saveData.ach[id] = Date.now(); persist(); toasts.queue.push(a);
}
// Verbos por repasar (clave: presente). Fallar lo marca; cada acierto con él descuenta uno
function markWeak(pl, wrong) {
  if (G.tutorial || pl.pair < 0) return;
  const k = weakKey(pl.pair), w = saveData.weak;
  if (wrong) w[k] = WEAK_HITS;
  else if (w[k]) { if (--w[k] <= 0) delete w[k]; }
  else return;
  persist();
}
function comboMult(c) { for (const [n, m] of COMBO_STEPS) if (c >= n) return m; return 1; }
function medalFor(score) { for (const m of MEDALS) if (score >= m.min) return m; return null; }
// Récord por modo: REGULAR usa saveData.best (el de siempre); los otros, saveData.bestModes[modo]
function bestOf(mode) { return mode === 'regular' ? (saveData.best || 0) : ((saveData.bestModes || {})[mode] || 0); }
function setBest(mode, v) { if (mode === 'regular') saveData.best = v; else { saveData.bestModes = saveData.bestModes || {}; saveData.bestModes[mode] = v; } }

let gameMode = 'regular'; // modo elegido en la pantalla de modos (RESTART y PLAY AGAIN lo repiten)
function newGame() {
  G = { mode: gameMode, score: 0, lives: MAX_LIVES, combo: 0, bestCombo: 0, correct: 0, errors: 0, fish: 0, fishToLife: 0,
    target: START_TARGET === 'random' ? pick(['past', 'present']) : START_TARGET, hitsInSeg: 0, segGoal: randInt(TARGET_SWITCH_MIN, TARGET_SWITCH_MAX), segErrors: 0,
    rows: [], visiblePairs: new Set(), camY: 0, startY: 0, maxMeters: 0, level: 0,
    tideY: 0, tideSpeed: TIDE_START_SPEED, tideRiseT: rand(TIDE_RISE_MIN_T, TIDE_RISE_MAX_T), tideRises: 0,
    review: [], reviewSet: new Set(), time: 0, endT: -1, over: false, heartT: 0, danger: false,
    errFlashT: 0, levelSign: null, lifeAnim: [-1, -1, -1], lifePop: [-1, -1, -1], goT: 0, tutorial: false, tutHi: false, pendingTarget: null, targetReady: false, targetPulse: 0, newRecord: false,
    multPulse: 0, skyFrom: 0, skyT: 0, trailT: 0 };

// Mientras se anuncia un cambio de objetivo valen los DOS tiempos (el estudiante ya leyó el cartel nuevo);
// caer en el tiempo nuevo aplica el cambio en ese momento
// SIMPLE/CONTINUOUS: vale la casilla con ok (no hay objetivo que cambie)
function formOk(pl) { if (G.mode !== 'regular') return !!pl.ok; return pl.form === G.target || (!!G.pendingTarget && pl.form === G.pendingTarget); }
function evaluate(pl) {
  if (pl.floor || pl.used || pl.state !== 'ok') return;
  if (!formOk(pl)) { onWrong(pl); return; }
  if (G.mode === 'regular' && pl.form !== G.target) setTarget(G.pendingTarget);
  onCorrect(pl);
}
function onCorrect(pl) {
  pl.used = true; pl.glowT = 0.5;
  G.combo++; G.bestCombo = Math.max(G.bestCombo, G.combo); G.correct++;
  const mult = comboMult(G.combo), pts = POINTS_CORRECT * mult;
  if (mult !== comboMult(G.combo - 1)) G.multPulse = 0.5;
  G.score += pts;
  floatText(mult > 1 ? `+${pts} ×${mult}` : `+${pts}`, pl.x + pl.w / 2, pl.y - 12);
  burst('spark', pl.x + pl.w / 2, pl.y, 14, [PAL.Y, PAL.W, PAL.u], 70, 0.5, 60, 1, 30);
  SFX.correct(G.combo);
  markWeak(pl, false);
  if (G.combo >= TIDE_COMBO_MIN && !G.tutorial) { // el combo empuja la marea hacia abajo
    G.tideY += TIDE_COMBO_PUSH;
    for (let i = 0; i < 8; i++) spawnP('drop', rand(WALL, VW - WALL), G.tideY - 2, rand(-20, 20), rand(-70, -30), rand(0.4, 0.7), pick([PAL.W, PAL.L]), 1, 300);
  }
  if (G.combo >= 3) player.celebrateT = 0.4;
  if (G.combo >= 10) unlock('combo10');
  if (G.correct >= 50) unlock('verbs50');
  if (G.pendingTarget) return; // ya viene un cambio de objetivo: no contar hacia el siguiente
  G.hitsInSeg++;
  if (G.hitsInSeg >= G.segGoal) {
    if (G.segErrors === 0) {
      G.score += POINTS_PERFECT;
      floatText('PERFECT!', VW / 2, G.camY + VH * 0.55, PAL.Y, 2, 1.2);
      floatText('+' + POINTS_PERFECT, VW / 2, G.camY + VH * 0.55 + 14, PAL.W, 1, 1.2);
      SFX.perfect();
      for (let i = 0; i < 20; i++) spawnP('confetti', rand(20, VW - 20), G.camY + HUD_H, rand(-20, 20), rand(20, 60), rand(1, 1.6), pick([PAL.Y, PAL.R, PAL.W, PAL.I, PAL.C]), 2, 30);
    }
    if (G.mode !== 'regular') { G.hitsInSeg = 0; G.segGoal = randInt(TARGET_SWITCH_MIN, TARGET_SWITCH_MAX); G.segErrors = 0; return; } // PERFECT sí, cambio de objetivo no
    // El nuevo objetivo vale cuando TERMINA el mensaje y el jugador está en el suelo (nunca a medio salto)
    const next = G.target === 'past' ? 'present' : 'past';
    G.pendingTarget = next; G.targetReady = false;
    G.hitsInSeg = 0; G.segGoal = randInt(TARGET_SWITCH_MIN, TARGET_SWITCH_MAX); G.segErrors = 0;
    queueAlert(ALERT_TEXT[next], () => { if (G && G.pendingTarget === next) G.targetReady = true; });
  }
}
function applyPendingTarget() {
  if (!G.pendingTarget || !G.targetReady) return;
  if (!(player.onGround || player.dead)) return;
  setTarget(G.pendingTarget);
}
function setTarget(t) { G.target = t; G.pendingTarget = null; G.targetReady = false; G.targetPulse = 0.8; }
function onWrong(pl) {
  pl.state = 'crack'; pl.crackT = CRACK_TIME;
  G.combo = 0; G.errors++; G.segErrors++;
  const v = modeList()[pl.pair], reg = G.mode === 'regular';
  if (!G.reviewSet.has(pl.pair)) { G.reviewSet.add(pl.pair); G.review.push(reg ? { a: v.present, b: v.past } : { a: v.base, b: v.ok }); }
  markWeak(pl, true);
  G.errFlashT = ERROR_FLASH_T; addShake(3, 0.3); SFX.error(); vibrate(60);
  // regular: dice qué tiempo era; otros modos: muestra la forma correcta

function loseLife() {

function collectFish(pl) {

function updateProgress() {
  const p = player;
  const m = Math.max(0, Math.floor((G.startY - p.y) / PX_PER_METER));
  if (m > G.maxMeters && !p.dead && !p.dying) G.maxMeters = m;
  const lvl = Math.floor(G.maxMeters / METERS_PER_LEVEL);
  if (lvl > G.level) {
    G.skyFrom = Math.min(G.level, SKY_LEVELS.length - 1); G.skyT = 0;
    G.level = lvl;
    G.tideSpeed = Math.min(TIDE_MAX_SPEED, G.tideSpeed * TIDE_LEVEL_FACTOR);
    G.levelSign = { t: 0, line1: (lvl * METERS_PER_LEVEL) + ' M', line2: LEVEL_NAMES[Math.min(lvl, LEVEL_NAMES.length - 1)] };

  }
  if (G.maxMeters >= 100) unlock('m100');
  if (G.maxMeters >= 200) unlock('king');
  if (G.maxMeters >= 50 && G.errors === 0) unlock('nomistake');
}

function updateCamera(dt) {
  const target = G.startY - G.reached * ROW_GAP - (VH - cameraRowFromBottom());
  if (target < G.camY) G.camY += (target - G.camY) * Math.min(1, dt * CAMERA_SMOOTH);
}

function updateGame(dt) {
  G.time += dt; G.skyT += dt;
  if (G.goT > 0) G.goT -= dt;
  updatePlayer(dt);
  updateComboTrail(dt);
  updateSkinFx(dt);
  updatePlatforms(dt);
  // peces
  if (!player.dead && !player.dying) for (const row of G.rows) {
    if (Math.abs(row.y - player.y) > 40) continue;
    for (const pl of row.plats) if (pl.fish && pl.state !== 'broken') {
      const fx = pl.x + pl.w / 2, fy = pl.y - 11;
      if (Math.abs(player.x - fx) < 11 && fy > player.y - HITBOX_H - 4 && fy < player.y + 2) collectFish(pl);
    }
  }
  updateCamera(dt);
  updateTide(dt);
  if (!G.tutorial) { updateRows(); updateProgress(); }
  updateAlerts(dt);
  if (G.errFlashT > 0) G.errFlashT -= dt;
  if (G.multPulse > 0) G.multPulse -= dt;
  if (G.targetPulse > 0) G.targetPulse -= dt;
  if (G.mode !== 'regular' && G.qRow !== G.reached) { G.qRow = G.reached; if (G.reached > 0) G.targetPulse = 0.5; } // verbo nuevo en el HUD: parpadea
  applyPendingTarget();
  if (G.levelSign) { G.levelSign.t += dt; if (G.levelSign.t > 1.8) G.levelSign = null; }
  for (let i = 0; i < 3; i++) { if (G.lifeAnim[i] >= 0) { G.lifeAnim[i] += dt; if (G.lifeAnim[i] > 0.7) G.lifeAnim[i] = -1; } if (G.lifePop[i] >= 0) { G.lifePop[i] += dt; if (G.lifePop[i] > 0.4) G.lifePop[i] = -1; } }
  if (G.endT > 0) { G.endT -= dt; if (G.endT <= 0) gameOver(); }
}

function gameOver() {
  if (G.over) return;
  G.over = true;
  saveData.games = (saveData.games || 0) + 1;
  G.newRecord = G.score > bestOf(G.mode) && G.score > 0;
  if (G.newRecord) setBest(G.mode, G.score);
  persist();
  goTo(enterGameOver);
}

let uiButtons = [];

function btnRect(b) { return { x: b.cx - b.w / 2, y: b.cy - b.h / 2, w: b.w, h: b.h }; }
function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

function uiPointerDown(id, px, py) {

    if (b.disabled) { SFX.error(); vibrate(30); return; }

  }
  if (state === 'gameover') reviewScroll.drag = { id, y: v.y, start: reviewScroll.off };
}
function uiPointerMove(id, px, py) {
  const v = toVirtual(px, py);
  if (uiPress && uiPress.id === id) uiPress.btn.pressed = inRect(v, btnRect(uiPress.btn));
  if (reviewScroll.drag && reviewScroll.drag.id === id) reviewScroll.off = reviewScroll.drag.start - (v.y - reviewScroll.drag.y);
  const d = shop.drag;
  if (state === 'shop' && d && d.id === id && shopLayout().max > 0) {

// Botones = bloques de hielo, con el mismo lenguaje que las casillas: parte de arriba clara (face), línea blanca,
// cuerpo (mid), franja de abajo (band), canto (shadow), contorno (edge), brillos (light), letras (text), récord (best)
const BTN_COL = { face: '#C9F2FF', mid: '#8CDCF5', band: '#4C9BE0', shadow: '#2850A8', edge: '#1B2A5A', light: '#FFFFFF', text: '#1B2A5A', best: '#2850A8' };
const BTN_OFF = { face: '#C3CBD6', mid: '#9AA6B6', band: '#6B7788', shadow: '#4A5363', edge: '#2A3040', light: '#E6EBF2', text: '#4A5363', best: '#4A5363' };
function strSeed(s) { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) % 9973; return h; }
// Bloque de hielo: sombra proyectada, contorno con esquinas redondeadas, brillos diagonales como los de las casillas,
// estrellita que titila, canto de 3 px y destello que lo cruza cada tanto. split = dónde va la línea blanca (fracción del alto).
// deco = montoncitos de nieve sueltos encima y carámbanos colgando (solo en botones de 16 px o más)
function drawPanel(c, x, y, w, h, col, o = {}) {
  const depth = o.pressed ? 0 : 3, seed = o.seed || 0;
  c.fillStyle = 'rgba(5,10,35,0.35)'; c.fillRect(x + 2, y + 3, w, h + depth); // sombra proyectada
  c.fillStyle = col.edge; c.fillRect(x - 1, y - 1, w + 2, h + 2 + depth);
  c.fillStyle = col.shadow; c.fillRect(x, y + h, w, depth);
  const line = Math.min(h - 5, R(h * (o.split || 0.72)));
  c.fillStyle = col.face; c.fillRect(x, y, w, line);
  c.fillStyle = col.light; c.fillRect(x + 1, y + line, w - 2, 1); // línea blanca, como en las casillas
  c.fillStyle = col.mid; c.fillRect(x, y + line + 1, w, h - line - 1);
  c.fillStyle = col.band; c.fillRect(x, y + h - 3, w, 3);
  c.fillStyle = col.mid; c.fillRect(x + 3 + (seed % Math.max(1, w - 10)), y + h - 2, 4, 1); // rayita de luz en la franja
  c.fillStyle = col.light; c.fillRect(x + 1, y + 1, w - 2, 1); c.fillRect(x + 1, y + 1, 1, line - 1); // bordes con luz
  c.fillStyle = col.mid; c.fillRect(x + w - 2, y + 2, 1, line - 2);
  // brillos diagonales: uno arriba a la izquierda (como el de las casillas) y otro abajo a la derecha
  const gl = Math.min(7, line - 3);
  c.fillStyle = col.light;
  for (let i = 0; i < gl; i++) c.fillRect(x + 3 + gl - i, y + 2 + i, i < gl - 2 ? 2 : 1, 1);
  const g2 = Math.min(5, h - line - 4), gx = x + w - 10 - (seed % 7);
  for (let i = 0; i < g2; i++) c.fillRect(gx + g2 - i, y + line + 1 + i, 1, 1);
  if (Math.sin(globalT * 2 + seed) > 0.75) { const sx = x + w - 6, sy = y + 4; c.fillRect(sx - 1, sy, 3, 1); c.fillRect(sx, sy - 1, 1, 3); } // estrellita
  c.fillStyle = col.edge; // esquinas redondeadas
  c.fillRect(x, y, 1, 1); c.fillRect(x + w - 1, y, 1, 1); c.fillRect(x, y + h + depth - 1, 1, 1); c.fillRect(x + w - 1, y + h + depth - 1, 1, 1);
  const k = (globalT + seed * 0.37) % 5; // destello diagonal
  if (k < 0.4) {
    const sx = x - h + (w + h * 2) * (k / 0.4);
    c.save(); c.beginPath(); c.rect(x + 1, y + 1, w - 2, h - 2); c.clip();
    c.fillStyle = 'rgba(255,255,255,0.55)';
    for (let i = 0; i < h; i++) c.fillRect(R(sx - i * 0.5), y + i, 3, 1);
    c.restore();
  }
  if (!o.deco || h < 16) return;
  // nieve: montoncitos sueltos sobre el borde de arriba (no una capa entera)
  for (let cx = x + 2; cx < x + w - 2; cx++) {
    const n = Math.sin(cx * 0.22 + seed) + Math.sin(cx * 0.61 + seed * 1.7) * 0.6;
    if (n < 0.55) continue;
    const ch = n > 1.1 ? 2 : 1;
    c.fillStyle = col.edge; c.fillRect(cx, y - 1 - ch, 1, 1);
    c.fillStyle = PAL.W; c.fillRect(cx, y - ch, 1, ch + 1);
  }
  // carámbanos debajo del canto
  if (o.pressed) return;
  const by = y + h + depth + 1;
  for (let ix = x + 5 + (seed % 5); ix < x + w - 5; ix += 11 + ((ix + seed) % 9)) {
    const len = 1 + ((ix * 3 + seed) % 4);
    c.fillStyle = col.edge; c.fillRect(ix - 2, by - 1, 5, 2); c.fillRect(ix - 1, by, 3, len); c.fillRect(ix, by + len, 1, 1);
    c.fillStyle = PAL.L; c.fillRect(ix - 1, by - 1, 3, 1); c.fillRect(ix, by, 1, len - 1);
    c.fillStyle = PAL.W; c.fillRect(ix - 1, by - 1, 1, 1); c.fillRect(ix, by, 1, 1);
  }
}
function drawButton(c, b) {
  const k = clamp((screenT - b.delay) / 0.35, 0, 1); if (k <= 0) return;
  const s = easeOutBack(k);
  const w = Math.max(2, R(b.w * s)), h = Math.max(2, R(b.h * s));
  const x = R(b.cx - w / 2), y0 = R(b.cy - h / 2), y = b.pressed ? y0 + 2 : y0;
  const col = b.disabled ? BTN_OFF : BTN_COL; // apagado: p. ej. no alcanzan los peces
  drawPanel(c, x, y, w, h, col, { pressed: b.pressed, seed: strSeed(b.label), deco: k >= 1 && !b.clip });
  if (k > 0.6) {
    const ty = y + R((h - 4 - FONT_H * b.sc) / 2); // centrado sobre la parte clara (arriba de la línea blanca)
    drawWord(b.label, b.cx, ty + 1, b.sc, col.light, 'center', c); // relieve claro debajo
    drawWord(b.label, b.cx, ty, b.sc, col.text, 'center', c);
  }
}

const TITLE_SC = 4;
const TITLE_COLS = [

// Subtítulo de miedo: letras rojas que tiemblan y gotitas de agua que caen de algunas
const SUBTITLE = 'ESCAPE THE TIDE!';
function drawSubtitle(c, cy) {
  const k = clamp((screenT - 0.9) / 0.4, 0, 1); if (k <= 0) return;
  const sc = 2, w = measureWord(SUBTITLE, sc); let x = R(VW / 2 - w / 2);
  const shakeT = Math.floor(globalT * 12);

    const ch = SUBTITLE[i], cw = (glyphW(ch) + 1) * sc;

      const y = cy + R((1 - k) * -6) + jit, lx = x + (((shakeT + i * 5) % 17 === 0) ? 1 : 0);
      drawWordO(ch, lx, y + 1, sc, '#3A0610', '#3A0610', 'left', c);
      drawWordO(ch, lx, y, sc, '#FF4D4D', PAL.k, 'left', c);

      if (i % 3 === 1 && k >= 1) { // gota que cae y se desvanece

        if (d < 12) { c.fillStyle = d < 8 ? PAL.I : PAL.B; c.fillRect(lx + R(cw / 2) - 1, y + sc * 5 + 1 + R(d), 1, 2); }

// --- Cuenta regresiva ---
let cdT = 0, cdLast = -1;
// Primero se muestra el objetivo con calma (sin alarma) START_MSG_T segundos, luego 3-2-1-GO! y empieza el juego.
function enterCountdown() { newGame(); setScreen('countdown'); cdT = -START_MSG_T; cdLast = -1; }
function updateCountdown(dt) {
  cdT += dt;
  if (cdT >= 0) {
    const idx = Math.floor(cdT / 0.7);
    if (idx !== cdLast && idx < 3) { cdLast = idx; SFX.beep(); }
  }
  if (cdT >= 2.1) {
    state = 'play'; screenT = 0; G.goT = 0.6; SFX.go(); startMusic();
    unlock('first');
  }
  for (const row of G.rows) if (row.spawnT < ROW_APPEAR_T) row.spawnT += dt;
  updateTideFx(dt);
}
// Mensaje inicial del objetivo: aparece con un pequeño rebote, sin icono ni sirena
function drawStartMessage(c, t) {
  const k = clamp(t / 0.35, 0, 1), out = clamp((START_MSG_T - t) / 0.25, 0, 1);
  const s = easeOutBack(k) * out; if (s <= 0.05) return;
  const m = MODES[G.mode], reg = G.mode === 'regular'; // SIMPLE/CONTINUOUS: su objetivo + un ejemplo
  const bw = R(170 * s), bh = R((reg ? 54 : 66) * s), x = R((VW - bw) / 2), y = R(VH * 0.36 - bh / 2);
  c.fillStyle = PAL.k; c.fillRect(x - 1, y - 1, bw + 2, bh + 2);
  c.fillStyle = PAL.N; c.fillRect(x, y, bw, bh);
  c.fillStyle = reg ? PAL.Y : m.col.face; c.fillRect(x, y, bw, 2); c.fillRect(x, y + bh - 2, bw, 2);
  if (k >= 1 && out >= 1) {
    drawWord('YOUR GOAL:', VW / 2, y + 7, 1, PAL.L, 'center', c);
    drawLines(reg ? ALERT_TEXT[G.target] : m.goal, VW / 2, y + 32, 2, reg ? PAL.Y : m.col.mid, null);
    if (!reg) drawWord(m.example, VW / 2, y + 52, 1, PAL.W, 'center', c);
  }
}
function drawCountdown(c) {
  if (cdT < 0) { drawStartMessage(c, cdT + START_MSG_T); return; }
  const idx = Math.floor(cdT / 0.7), k = (cdT % 0.7) / 0.7;
  const txt = String(3 - idx), sc = k < 0.15 ? 8 : (k < 0.3 ? 7 : 6);
  if (Math.floor(k * 10) % 4 === 3 && k > 0.7) return;
  drawWordO(txt, VW / 2, VH * 0.4 - (FONT_H * sc) / 2, sc, PAL.Y, PAL.N, 'center', c);
}
function drawGo(c) {
  if (!G.goT || G.goT <= 0) return;
  const k = 1 - G.goT / 0.6, sc = k < 0.2 ? 6 : 5;
  if (k > 0.7 && Math.floor(k * 20) % 2) return;
  drawWordO('GO!', VW / 2, VH * 0.4 - (FONT_H * sc) / 2, sc, PAL.Y, PAL.N, 'center', c);
}

// --- Tutorial: demostración en la que el esquimal juega solo ---
// Nivel fijo y un guion de pasos. Cada paso puede mostrar un texto (cap), ejecutar algo (fn),
// caminar hasta una x (walk), saltar (jump) o esperar (wait). SKIP lleva directo a jugar.
const tut = { steps: [], i: 0, t: 0, cap: '', phase: 0, done: false };
function tutorialScript() {
  return [
    { cap: 'HOW TO PLAY', wait: 1.4 },
    { cap: 'USE ← → TO MOVE' }, { walk: 60 }, { walk: 98 }, { wait: 0.3 },
    { cap: 'LOOK AT YOUR GOAL:\nFIND PAST VERBS', fn: () => { G.tutHi = true; } }, { wait: 2.4 },
    { cap: 'TAP JUMP TO LAND ON\nA PAST VERB', fn: () => { G.tutHi = false; } }, { wait: 0.8 }, { jump: true },
    { cap: 'WENT IS PAST!\nYOU GET POINTS', wait: 2 },
    { cap: 'A WRONG VERB\nBREAKS THE ICE...' }, { walk: 76 }, { wait: 0.5 }, { jump: true }, { wait: 1.2 },
    { cap: '...AND YOU\nLOSE A LIFE!', wait: 2 },
    { cap: 'SAW IS PAST.\nJUMP ON IT!' }, { walk: 120 }, { wait: 0.3 }, { jump: true }, { wait: 0.8 },
    { cap: 'CATCH FISH\nFOR MORE POINTS!' }, { wait: 0.4 }, { jump: true }, { wait: 1.4 },
    { cap: '', fn: () => { G.target = 'present'; queueAlert(ALERT_TEXT.present); } }, { wait: ALERT_SIGNAL_T + ALERT_MSG_T },
    { cap: 'THE GOAL CHANGES!\nREAD THE MESSAGES', wait: 2.2 },
    { cap: 'NOW FIND PRESENT:\nGO IS PRESENT!' }, { wait: 0.6 }, { jump: true }, { wait: 1.2 },
    { cap: 'WATCH OUT!\nTHE WATER RISES!', fn: () => { G.tideSpeed = 26; } }, { wait: 2.4, fn: null },
    { cap: "READY?\nLET'S GO!", fn: () => { G.tideSpeed = 2; } }, { wait: 1.8 },
  ];
}
function tutPlat(row, x, w, text, form, fish) {
  const pair = VERBS.findIndex((v) => v[form] === text.toLowerCase());
  const pl = makePlat(x, row.y, pair < 0 ? 0 : pair, form, row);
  pl.w = Math.max(w, tileWidth(pl.text)); pl.kind = 'normal';
  if (fish) pl.fish = { t: 0 };
  row.plats.push(pl);
}
function enterTutorial() {
  gameMode = 'regular'; // el tutorial es de REGULAR y al terminar se juega REGULAR
  newGame();
  G.tutorial = true; G.target = 'past'; G.segGoal = 999; G.tideRiseT = 1e9; G.tideSpeed = 2;
  const floor = G.rows[0];
  G.rows.length = 1; G.visiblePairs.clear();
  const mk = (i) => { const r = { y: floor.y - i * ROW_GAP, plats: [], i, spawnT: -0.12 * i }; G.rows.push(r); return r; };
  const r1 = mk(1), r2 = mk(2), r3 = mk(3), r4 = mk(4);
  tutPlat(r1, 14, 40, 'EAT', 'present'); tutPlat(r1, 70, 56, 'WENT', 'past'); tutPlat(r1, 142, 40, 'PLAY', 'present');
  tutPlat(r2, 46, 44, 'SING', 'present'); tutPlat(r2, 108, 44, 'SAW', 'past');
  tutPlat(r3, 26, 40, 'RUN', 'present'); tutPlat(r3, 104, 44, 'TOOK', 'past', true);
  tutPlat(r4, 40, 40, 'MADE', 'past'); tutPlat(r4, 104, 44, 'GO', 'present');
  tut.steps = tutorialScript(); tut.i = 0; tut.t = 0; tut.cap = ''; tut.phase = 0; tut.done = false;
  setScreen('tutorial');
  uiButtons = [makeBtn('SKIP →', VW - 36, HUD_H + 14, 58, 20, 1, endTutorial, 0.4)];
  startMusic();
}
function endTutorial() {
  if (tut.done) return;
  tut.done = true;
  saveData.tutorialSeen = true; persist();
  goTo(enterCountdown);
}
function runTutorial(dt) {
  const p = player;
  input.left = input.right = false;
  if (tut.done) { input.jump = false; return; }
  const s = tut.steps[tut.i];
  if (!s) { input.jump = false; endTutorial(); return; }
  if (tut.t === 0) { if (s.cap !== undefined) tut.cap = s.cap; if (s.fn) s.fn(); }
  tut.t += dt;
  let next = false;
  if (s.walk !== undefined) {
    const d = s.walk - p.x, stopDist = (p.vx * p.vx) / (2 * FRICTION) + 1;
    const towards = Math.sign(d) === Math.sign(p.vx);
    if (Math.abs(d) > 2 && !(towards && Math.abs(d) <= stopDist)) { if (d < 0) input.left = true; else input.right = true; } // soltar a tiempo: el hielo resbala
    next = (Math.abs(p.vx) < 1 && Math.abs(d) <= 4) || tut.t > 4;
  } else if (s.jump) {
    if (tut.phase === 0) { p.jumpBuf = JUMP_BUFFER; input.jump = true; tut.phase = 1; }
    else if (tut.phase === 1) { input.jump = true; if (!p.onGround) tut.phase = 2; }
    else { input.jump = !p.onGround && p.vy < 0; if (p.onGround) next = true; }
    if (tut.t > 3) next = true;
  } else next = tut.t >= (s.wait || 0);
  if (next) { tut.i++; tut.t = 0; tut.phase = 0; input.jump = false; }
}
function updateTutorial(dt) {
  runTutorial(dt);
  updateGame(dt);
  updateTideFx(dt);
}

// --- Juego (render del mundo) ---
// Estela de chispas en combo alto (×3 o más), solo mientras se mueve
function updateComboTrail(dt) {
  const p = player;
  if (p.dead || p.dying || comboMult(G.combo) < COMBO_TRAIL_MULT || (Math.abs(p.vx) < 20 && p.onGround)) return;
  G.trailT -= dt; if (G.trailT > 0) return;
  G.trailT = 0.025;
  const gold = comboMult(G.combo) >= COMBO_GLOW_MULT;
  spawnP('spark', p.x - Math.sign(p.vx || p.facing) * 4 + rand(-2, 2), p.y - rand(4, 16), -p.vx * 0.15 + rand(-6, 6), rand(-10, 4), rand(0.3, 0.5),
    pick(gold ? [PAL.Y, PAL.y, PAL.u] : [PAL.W, PAL.L, PAL.Y]), Math.random() < 0.6 ? 2 : 1, 0);
}
// Skin de oro: destellos sueltos sobre el personaje cada tanto (brillo metálico)
function updateSkinFx(dt) {
  const p = player;
  if (p.dead || p.dying) return;
  if (saveData.skin === 'rainbow') { updateRainbowTrail(dt); return; }
  G.skinFxT = skinFxAt(dt, G.skinFxT || 0, p.x, p.y, Math.abs(p.vx) > 20 || !p.onGround);
}
// Emite las partículas de la skin equipada alrededor de (x, pies). Devuelve el nuevo temporizador. También se usa en el título
function skinFxAt(dt, timer, x, y, moving) {
  const fx = SKIN_FX[saveData.skin]; if (!fx) return 0;
  timer -= dt; if (timer > 0) return timer;
  timer = rand(fx.every[0], fx.every[1]);
  if (fx.move && !moving) return timer; // algunas solo al moverse (humo del ninja)
  const vx = fx.vx ? rand(-fx.vx, fx.vx) : rand(-3, 3);
  spawnP(fx.kind || 'spark', x + rand(-8, 8), y - rand(fx.y[0], fx.y[1]), vx, rand(fx.vy[0], fx.vy[1]), rand(fx.life ? fx.life[0] : 0.3, fx.life ? fx.life[1] : 0.6), pick(fx.colors), Math.random() < fx.big ? 2 : 1, fx.g || 0);
  return timer;
}
// Partículas sueltas por skin: every = segundos entre una y otra, y = altura sobre los pies, vy = velocidad vertical, big = prob. de 2 px.

  ice:      { every: [0.3, 0.7], y: [4, 24], vy: [2, 8], big: 0, colors: ['#FFFFFF', '#D6F3FF', '#7CC6EE'] },     // escarcha que cae

  ninja:    { every: [0.06, 0.14], y: [0, 6], vy: [-8, -3], vx: 8, life: [0.35, 0.6], kind: 'mote', big: 0.7, move: true, colors: ['#4A4A5A', '#6A6A7A', '#2A2A35', '#4A4A5A', '#E53935'] }, // humo al moverse
  teacher:  { every: [0.2, 0.45], y: [8, 22], vy: [3, 8], vx: 4, life: [0.6, 1], kind: 'mote', big: 0.2, colors: ['#FFFFFF', '#FFF59D', '#F8BBD0', '#B3E5FC'] }, // polvo de tiza de colores
  king:     { every: [0.15, 0.35], y: [10, 28], vy: [-8, -2], big: 0.15, colors: ['#FFD34E', '#FFF4D6', '#B388FF', '#7C4DFF'] }, // destellos reales
  penguin:  { every: [0.3, 0.6], y: [6, 18], vy: [6, 14], life: [0.4, 0.6], g: 60, big: 0, colors: ['#7FD8F5', '#B8EEFF', '#FFFFFF'] }, // gotitas de agua
  graduate: { every: [0.25, 0.5], y: [16, 30], vy: [-12, -5], vx: 5, big: 0.3, colors: ['#FFD34E', '#FFFFFF', '#E8A530'] }, // estrellitas de logro
  fire:     { every: [0.06, 0.14], y: [14, 26], vy: [-40, -20], big: 0.4, colors: ['#FFD54F', '#FB8C00', '#F4511E', '#D32F2F'] }, // chispas que suben

};
// Skin arcoíris: mientras se mueve deja una cinta de 6 franjas, siempre atravesada a la dirección del movimiento
function updateRainbowTrail(dt) {
  const p = player;
  if (Math.abs(p.vx) < 20 && p.onGround) return;
  G.skinFxT = (G.skinFxT || 0) - dt; if (G.skinFxT > 0) return;
  G.skinFxT = RAINBOW_TRAIL_T;
  const v = Math.hypot(p.vx, p.vy) || 1, dx = p.vx / v, dy = p.vy / v; // dirección; la cinta va en (-dy, dx)
  const s = dx < 0 || (dx === 0 && dy > 0) ? -1 : 1; // rojo siempre del lado de arriba/izquierda
  const cx = p.x - dx * 10, cy = p.y - 11 - dy * 10; // empieza detrás del cuerpo, no encima
  RAINBOW_COLORS.forEach((col, i) => { const o = (2.5 - i) * 2 * s; spawnP('spark', R(cx + dy * o - 1), R(cy - dx * o - 1), 0, 0, RAINBOW_TRAIL_LIFE, col, 2, 0); });
}
// Halo dorado que late detrás del personaje (×4) con dos destellos girando
function drawComboGlow(c, p, camY) {
  if (p.dead || p.dying || comboMult(G.combo) < COMBO_GLOW_MULT) return;
  const cx = R(p.x), cy = R(p.y - camY - 11), pulse = Math.sin(globalT * 8) * 1.5;
  const rings = [[16, 0.14], [12, 0.2], [8, 0.26]];
  c.fillStyle = PAL.Y;
  for (const [r0, a] of rings) { // círculo pixelado, fila por fila
    const r = r0 + pulse; c.globalAlpha = a;
    for (let dy = -R(r); dy <= R(r); dy++) { const hw = R(Math.sqrt(Math.max(0, r * r - dy * dy))); c.fillRect(cx - hw, cy + dy, hw * 2, 1); }
  }
  c.globalAlpha = 1;
  for (let i = 0; i < 2; i++) {
    const ang = globalT * 4 + i * Math.PI;
    const sx = R(cx + Math.cos(ang) * 14), sy = R(cy + Math.sin(ang) * 7);
    c.fillStyle = PAL.W; c.fillRect(sx, sy, 1, 1); c.fillStyle = PAL.Y; c.fillRect(sx - 1, sy, 1, 1); c.fillRect(sx + 1, sy, 1, 1); c.fillRect(sx, sy - 1, 1, 1); c.fillRect(sx, sy + 1, 1, 1);
  }
}
// Sombra del personaje sobre la casilla que tiene debajo (más chica y clara cuanto más alto está)
function drawPlayerShadow(c, camY) {
  const p = player; if (p.dead || p.dying) return;
  let best = null;
  for (const row of G.rows) for (const pl of row.plats) {
    if (pl.state === 'broken' || pl.y < p.y - 1 || p.x < pl.x || p.x > pl.x + pl.w) continue;
    if (!best || pl.y < best.y) best = pl;
  }
  if (!best) return;
  const k = clamp(1 - (best.y - p.y) / 80, 0, 1); if (k <= 0.1) return;
  const y = platScreenY(best, camY); if (y == null) return;
  const w = R(14 * k), x = R(p.x - w / 2), yy = R(y) + 1;
  c.fillStyle = `rgba(5,10,35,${(0.3 * k).toFixed(2)})`;
  c.fillRect(x, yy, w, 1); c.fillRect(x + 2, yy + 1, Math.max(0, w - 4), 1);
}
function drawPlayer(c, camY) {
  const p = player;
  if (p.invuln > 0 && !p.dead && Math.floor(p.invuln * 12) % 2 === 0) return;
  let sx = 1, sy = 1;
  if (p.sqT > 0) { const k = p.sqT / p.sqDur; if (p.sqKind === 'land') { sy = 1 - 0.22 * k; sx = 1 + 0.18 * k; } else { sy = 1 + 0.16 * k; sx = 1 - 0.1 * k; } }
  else if (!p.onGround && !p.dead) { const v = clamp(Math.abs(p.vy) / JUMP_V, 0, 1); sy = 1 + 0.07 * v; sx = 1 - 0.05 * v; } // se estira al subir rápido o caer
  drawComboGlow(c, p, camY);
  const flip = p.facing < 0, by = p.y - camY + 1;
  const tint = p.hurtT > 0 && Math.floor(p.hurtT * 14) % 2 === 0 ? 0.45 : 0; // parpadeo rojo de dolor
  if (p.dying) { // se cae de lado (90° en 0,3 s) en rojo con cara de derrota; al hacer «puf» ya no se dibuja
    if (p.poof) return;
    const k = clamp(p.dyingT / 0.3, 0, 1);
    drawCharFx(c, 'face_derrotado', p.x, by, 1, 1, flip, 0.25 + 0.2 * (Math.floor(p.dyingT * 10) % 2), (flip ? -1 : 1) * k * Math.PI / 2);
    return;
  }
  if (p.dead) { drawCharFx(c, 'dead', p.x, by, 1, 1, flip, tint, 0); return; }
  let name;
  if (p.hurtT > 0) name = 'face_asustado';
  else if (p.celebrateT > 0) name = 'celebrate';
  else if (!p.onGround && p.airT > 0.04) name = p.vy < 40 ? 'jump' : 'fall';
  else if (p.walkT > 0) { drawWalk(c, p.x, by, p.walkT, flip, sx, sy, G.danger); return; }
  else if (G.danger) name = 'face_asustado';
  else name = Math.floor(globalT * 2) % 2 ? 'idle_1' : 'idle_0';
  if (tint || p.hurtT > 0) drawCharFx(c, name, p.x, by, sx, sy, flip, tint, 0);
  else drawChar(c, name, p.x, by, sx, sy, flip);
}
// Personaje teñido de rojo (dolor) y/o girado alrededor del centro del cuerpo. Se pinta primero en un lienzo de 24×24
const fxCanvas = document.createElement('canvas'); fxCanvas.width = fxCanvas.height = 24;
const fxCtx = fxCanvas.getContext('2d');
function drawCharFx(c, name, cx, by, sx, sy, flip, tint, rot) {
  fxCtx.clearRect(0, 0, 24, 24);
  drawFrame(fxCtx, name, 0, 0, 24, 24, flip);
  if (tint > 0) {
    fxCtx.globalCompositeOperation = 'source-atop'; fxCtx.globalAlpha = tint; fxCtx.fillStyle = HURT_COLOR; fxCtx.fillRect(0, 0, 24, 24);
    fxCtx.globalAlpha = 1; fxCtx.globalCompositeOperation = 'source-over';
  }
  const w = R(24 * sx), h = R(24 * sy);
  c.save(); c.translate(R(cx), R(by + CHAR_SINK - h / 2)); if (rot) c.rotate(rot);
  c.drawImage(fxCanvas, -R(w / 2), -R(h / 2), w, h); c.restore();
}

function drawWorld(c) {
  const camY = R(G.camY);
  drawSky(c);
  drawTwinkles(c, camY);
  drawMountains(c, camY, skyFade());
  drawSnow(c);
  for (const row of G.rows) for (const pl of row.plats) drawPlatformShadow(c, pl, camY);
  for (const row of G.rows) for (const pl of row.plats) drawPlatform(c, pl, camY);
  drawPlayerShadow(c, camY);
  drawPlayer(c, camY);
  drawParticles(c, camY);
  drawWalls(c, camY);
  drawTide(c, G.tideY - camY, globalT);
  c.drawImage(vignetteCanvas, 0, 0);
  drawDangerEdge(c);
  drawFloaters(c, camY);
  if (DEBUG) drawDebug(c, camY);
}

function drawGameOver(c) {
  c.drawImage(bgCanvas, 0, 0);

  });

  drawWordO('VERBS TO REVIEW', cx, ry, 1, PAL.Y, PAL.N, 'center', c);
  const listTop = ry + 9, listBot = VH - 32, lh = 8;
  c.fillStyle = 'rgba(11,11,18,0.55)'; c.fillRect(WALL + 4, listTop - 2, VW - WALL * 2 - 8, listBot - listTop + 2);

// --- Tienda (skins por peces) ---
const shop = { confirm: null, confirmT: 0, scroll: 0, drag: null };
// Tarjetas de SHOP_CARD_MIN a 52 px; si no caben todas entre el título y BACK, la lista se desplaza arrastrando (o con la rueda)
function shopLayout() {
  const top = 40, area = VH - 34 - top, ch = clamp(Math.floor(area / SKINS.length), SHOP_CARD_MIN, 52);
  return { top, ch, area, max: Math.max(0, SKINS.length * ch - area) };
}
function skinOwned(s) { return !!saveData.skins[s.id] || (s.ach ? !!saveData.ach[s.ach] : s.price === 0); }
function enterShop() { setScreen('shop'); shop.confirm = null; shop.confirmT = 0; shop.code = []; shop.scroll = 0; shop.drag = null; shopButtons(true); }
// Un botón por skin: EQUIP (ya comprada), BUY (apagado si no alcanzan los peces) o SURE? (confirmar la compra)
function shopButtons(first = false) {
  const { top, ch, area } = shopLayout();
  uiButtons = [makeBtn('BACK', VW / 2, VH - 16, 92, 20, 2, () => goTo(enterTitle), first ? 0.4 : 0)];
  SKINS.forEach((s, i) => {
    if (saveData.skin === s.id) return; // la que está en uso no lleva botón
    const cy = top + i * ch + R((ch - 3) / 2), cx = VW - WALL - 30, d = first ? 0.2 + Math.min(i, 8) * 0.05 : 0;
    let b = null;
    if (skinOwned(s)) b = makeBtn('EQUIP', cx, cy, 46, 16, 1, () => equipSkin(s), d);
    else if (!s.ach) { // las de logro no se compran
      b = makeBtn(shop.confirm === s.id ? 'SURE?' : 'BUY', cx, cy, 46, 16, 1, () => buySkin(s, i), d);
      b.disabled = saveData.fishBank < s.price;
    }
    if (b) { b.baseY = cy; b.cy = cy - shop.scroll; b.clip = [top, top + area]; uiButtons.push(b); } // se mueve con la lista
  });
}
function equipSkin(s) { saveData.skin = s.id; shop.confirm = null; persist(); SFX.lifeUp(); shopButtons(); }
function buySkin(s, i) {
  if (saveData.fishBank < s.price) return;
  if (shop.confirm !== s.id) { shop.confirm = s.id; shop.confirmT = SHOP_CONFIRM_T; shopButtons(); return; } // primer toque: SURE?
  saveData.fishBank -= s.price; saveData.skins[s.id] = Date.now(); saveData.skin = s.id; shop.confirm = null;
  persist(); SFX.achievement(); vibrate(40);
  const { top, ch } = shopLayout(), y = top + i * ch + ch / 2 - shop.scroll;
  burst('spark', WALL + 18, y, 18, [PAL.Y, PAL.W, PAL.u], 70, 0.6, 40);
  for (let k = 0; k < 16; k++) spawnP('confetti', rand(20, VW - 20), top - 4, rand(-20, 20), rand(20, 60), rand(1, 1.6), pick([PAL.Y, PAL.R, PAL.W, PAL.I, PAL.C]), 2, 30);
  shopButtons();
}
// Código secreto: guarda las últimas pulsaciones y, si coinciden con UNLOCK_CODE, desbloquea todo
function shopCode(k) {
  shop.code = (shop.code || []).concat(k).slice(-UNLOCK_CODE.length); vibrate(10);
  if (shop.code.join() !== UNLOCK_CODE.join()) return;
  shop.code = [];
  for (const s of SKINS) if (s.id !== 'default' && !saveData.skins[s.id]) saveData.skins[s.id] = Date.now();
  persist(); SFX.achievement(); vibrate(60);
  const { top, ch, area } = shopLayout();
  floatText('ALL SKINS UNLOCKED!', VW / 2, R((Math.min(top + SKINS.length * ch, top + area) + VH - 26) / 2) + 4, PAL.Y, 1, 1.6); // entre las tarjetas y BACK
  for (let i = 0; i < 24; i++) spawnP('confetti', rand(20, VW - 20), 30, rand(-20, 20), rand(20, 60), rand(1, 1.6), pick([PAL.Y, PAL.R, PAL.W, PAL.I, PAL.C]), 2, 30);
  shopButtons();
}
function updateShop(dt) {
  if (shop.confirmT > 0) { shop.confirmT -= dt; if (shop.confirmT <= 0) { shop.confirm = null; shopButtons(); } }
  shop.scroll = clamp(shop.scroll, 0, shopLayout().max);
  for (const b of uiButtons) if (b.baseY != null) b.cy = b.baseY - shop.scroll;
}
function drawShop(c) {
  c.drawImage(bgCanvas, 0, 0);
  drawSnow(c);
  drawWordO('SHOP', VW / 2, 6, 2, PAL.Y, PAL.k, 'center', c);
  // peces disponibles
  const txt = String(saveData.fishBank), w = SPR.fish.width * 2 + 3 + measureWord(txt);
  const fx = R(VW / 2 - w / 2);
  c.drawImage(SPR.fish, fx, 24, SPR.fish.width * 2, SPR.fish.height * 2);
  drawWordO(txt, fx + SPR.fish.width * 2 + 3, 26, 1, PAL.u, PAL.k, 'left', c);
  const { top, ch, area, max } = shopLayout();
  c.save(); c.beginPath(); c.rect(0, top, VW, area); c.clip(); // la lista solo se ve entre el título y BACK
  SKINS.forEach((s, i) => {
    const k = clamp((screenT - Math.min(i, 8) * 0.05) / 0.3, 0, 1); if (k <= 0) return;
    const y = top + i * ch - R(shop.scroll);
    if (y + ch < top || y > top + area) return;
    const x = WALL + 4 - R((1 - easeOutBack(k)) * 40), h = ch - 3, cw = VW - WALL * 2 - 8;
    const owned = skinOwned(s), using = saveData.skin === s.id;
    c.fillStyle = using ? PAL.D : 'rgba(11,11,18,0.6)'; c.fillRect(x, y, cw, h);
    if (using) { c.fillStyle = PAL.Y; c.fillRect(x, y, cw, 1); c.fillRect(x, y + h - 1, cw, 1); }
    // vista previa con la hoja de esa skin (respira como en el título)
    skinOverride = s.id;
    drawChar(c, Math.floor(globalT * 2 + i) % 2 ? 'idle_1' : 'idle_0', x + 16, y + R(h / 2) + 12);
    skinOverride = null;
    drawWord(s.name, x + 32, y + R(h / 2) - 7, 1, owned ? PAL.Y : PAL.W, 'left', c);
    if (using) drawWord('IN USE', x + 32, y + R(h / 2) + 1, 1, PAL.L, 'left', c);
    else if (owned) drawWord('OWNED', x + 32, y + R(h / 2) + 1, 1, PAL.L, 'left', c);
    else if (s.ach) { // candado + el logro que falta
      c.drawImage(SPR.lock, x + 32, y + R(h / 2), SPR.lock.width, SPR.lock.height);
      drawWord(ACHIEVEMENTS.find((a) => a.id === s.ach).name, x + 34 + SPR.lock.width, y + R(h / 2) + 1, 1, PAL.L, 'left', c);
    } else {
      c.drawImage(SPR.fish, x + 32, y + R(h / 2), SPR.fish.width, SPR.fish.height);
      drawWord(String(s.price), x + 34 + SPR.fish.width, y + R(h / 2) + 1, 1, saveData.fishBank >= s.price ? PAL.u : PAL.G, 'left', c);
    }
  });
  for (const b of uiButtons) if (b.clip) drawButton(c, b);
  c.restore();
  for (const b of uiButtons) if (!b.clip) drawButton(c, b);
  if (max > 0) { // barrita de desplazamiento a la derecha
    const bh = Math.max(12, R(area * area / (area + max))), by = top + R((area - bh) * shop.scroll / max);
    c.fillStyle = 'rgba(11,11,18,0.6)'; c.fillRect(VW - WALL - 3, top, 2, area);
    c.fillStyle = PAL.L; c.fillRect(VW - WALL - 3, by, 2, bh);
  }
  drawParticles(c, 0);
  drawFloaters(c, 0);
}

function drawDebug(c, camY) {
