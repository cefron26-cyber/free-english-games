  c.strokeRect(R(p.x - HITBOX_W / 2) + 0.5, R(p.y - HITBOX_H - camY) + 0.5, HITBOX_W - 1, HITBOX_H - 1);
  c.strokeStyle = '#00ff00';
  for (const row of G.rows) for (const pl of row.plats) if (pl.state !== 'broken') c.strokeRect(R(pl.x) + 0.5, R(pl.y - camY) + 0.5, pl.w - 1, 1);
  c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(WALL, VH - 30, 120, 28);
  drawWord('TARGET: ' + G.target + ' ' + G.hitsInSeg + '/' + G.segGoal, WALL + 2, VH - 28, 1, PAL.W, 'left', c);
  drawWord('TIDE: ' + G.tideSpeed.toFixed(1) + ' PX/S  ' + G.tideRiseT.toFixed(0) + 'S', WALL + 2, VH - 21, 1, PAL.W, 'left', c);
  drawWord('1 TGT 2 TIDE 3 ERR 4 LVL 5 ACH 6 FISH', WALL + 2, VH - 14, 1, PAL.Y, 'left', c);
  drawWord('DIST ' + R(G.tideY - p.y) + ' FPS ' + R(fps), WALL + 2, VH - 7, 1, PAL.W, 'left', c);
}
function debugKey(code) {
  if (code === 'Digit1') { G.target = G.target === 'past' ? 'present' : 'past'; G.hitsInSeg = 0; queueAlert(ALERT_TEXT[G.target]); }
  if (code === 'Digit2') G.tideRiseT = 0;
  if (code === 'Digit3') { G.errFlashT = ERROR_FLASH_T; addShake(3, 0.3); SFX.error(); }
  if (code === 'Digit4') G.maxMeters = (G.level + 1) * METERS_PER_LEVEL;
  if (code === 'Digit5') toasts.queue.push(pick(ACHIEVEMENTS));
  if (code === 'Digit6') { const r = G.rows[G.rows.length - 3]; if (r) r.plats[0].fish = { t: 0 }; }
}

// ===================== CONTROLES EN PANTALLA =====================
// Fondo del panel: pared de hielo oscura (degradado tramado + bloques) con capa de nieve y carámbanos arriba,
// para que los botones parezcan parte del escenario. Se dibuja una vez por tamaño de pantalla (en píxeles reales; u = 1 px virtual)
let panelCanvas = null;
function buildPanel() {
  const h = SH - ctrl.panelY; if (h <= 0) { panelCanvas = null; return; }
  const cv = document.createElement('canvas'); cv.width = SW; cv.height = h;
  const b = cv.getContext('2d'), u = Math.max(1, R(scale)), cols = ['#1B2A5A', '#16224B', '#111A3C', '#0D1430', '#0B0F25'];
  const rows = Math.ceil(h / u), cw = Math.ceil(SW / u);
  for (let by = 0; by < rows; by++) {
    const t = (by / rows) * (cols.length - 1), i0 = Math.floor(t), fr = t - i0;
    for (let bx = 0; bx < cw; bx++) { b.fillStyle = cols[Math.min(cols.length - 1, i0 + (fr * 16 > BAYER4[by & 3][bx & 3] ? 1 : 0))]; b.fillRect(bx * u, by * u, u, u); }
  }
  for (let by = 8; by < rows; by += 9) { // bloques de hielo: juntas oscuras con borde de luz debajo
    b.fillStyle = 'rgba(5,8,20,0.55)'; b.fillRect(0, by * u, SW, u);
    b.fillStyle = 'rgba(127,184,224,0.12)'; b.fillRect(0, (by + 1) * u, SW, u);
    const offB = (Math.floor(by / 9) % 2) * 9;
    for (let bx = offB; bx < cw; bx += 18) { b.fillStyle = 'rgba(5,8,20,0.55)'; b.fillRect(bx * u, (by + 1) * u, u, 8 * u); b.fillStyle = 'rgba(127,184,224,0.12)'; b.fillRect((bx + 1) * u, (by + 1) * u, u, 8 * u); }
  }
  for (let bx = 0; bx < cw; bx++) { // capa de nieve irregular
    const ch = clamp(3 + R(Math.sin(bx * 0.3) * 1.5 + Math.sin(bx * 0.83 + 1)), 2, 6);
    b.fillStyle = PAL.W; b.fillRect(bx * u, 0, u, ch * u);
    b.fillStyle = PAL.L; b.fillRect(bx * u, ch * u, u, u);
    if ((bx * 7) % 5 === 0) { b.fillStyle = '#7FB8E0'; b.fillRect(bx * u, (ch + 1) * u, u, u); }
  }
  for (let bx = 4; bx < cw - 2; bx += 7 + ((bx * 13) % 7)) { // carámbanos
    const len = 3 + ((bx * 5) % 6), y = (5 + (bx % 2)) * u;
    b.fillStyle = PAL.L; b.fillRect((bx - 1) * u, y, 3 * u, 2 * u); b.fillRect(bx * u, y, u, len * u);
    b.fillStyle = PAL.W; b.fillRect((bx - 1) * u, y, u, 2 * u); b.fillRect(bx * u, y, u, Math.max(1, len - 3) * u);
  }
  panelCanvas = cv;
}
function drawControlsPanel() {
  const y0 = ctrl.panelY;
  if (panelCanvas) ctx.drawImage(panelCanvas, 0, y0); else { ctx.fillStyle = PAL.k; ctx.fillRect(0, y0, SW, SH - y0); }
  const active = state === 'play' || state === 'countdown' || state === 'tutorial';
  const bs = ctrl.bs;
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; // sombra de cada botón sobre la pared
  for (const r of [ctrl.left, ctrl.right, ctrl.jump]) ctx.fillRect(r.x + 2 * bs, r.y + 3 * bs, r.w - 2 * bs, r.h - 2 * bs);
  ctx.globalAlpha = active ? 1 : 0.45;
  const draw = (name, r) => { const f = frameOf(name); ctx.drawImage(SHEET, f.x, f.y, f.w, f.h, r.x, r.y, f.w * bs, f.h * bs); };
  // En el tutorial los botones se hunden solos, mostrando lo que "presiona" la demostración
  const on = state === 'tutorial' ? input : { left: touchBtn.left || keys.left, right: touchBtn.right || keys.right, jump: touchBtn.jump || keys.jump };
  draw(on.left ? 'btn_left_pressed' : 'btn_left', ctrl.left);
  draw(on.right ? 'btn_right_pressed' : 'btn_right', ctrl.right);
  draw(on.jump ? 'btn_jump_pressed' : 'btn_jump', ctrl.jump);
  ctx.globalAlpha = 1;
}

// ===================== BUCLE PRINCIPAL =====================
let lastTs = 0, fps = 60, loadError = null;
function update(dt) {
  globalT += dt; screenT += dt;
  updateTransition(dt);
  updateParticles(dt);
  updateFloaters(dt);
  updateSnow(dt, state === 'play' || state === 'countdown' || state === 'pause' || state === 'tutorial' ? R(G.camY) : 0);
  updateToasts(dt);
  updateUI(dt);
  updateMusic();
  if (shake.t > 0) { shake.t -= dt; if (shake.t <= 0) shake.mag = 0; }
  if (state === 'title') { playIntro(dt); updateTideFx(dt); }
  else if (state === 'countdown') updateCountdown(dt);
  else if (state === 'play') { updateGame(dt); updateTideFx(dt); }
  else if (state === 'tutorial') updateTutorial(dt);
  else if (state === 'gameover') updateGameOver(dt);
  else if (state === 'shop') updateShop(dt);
}
function render() {
  const c = octx;
  c.save();
  if (shake.t > 0 && shake.mag > 0 && (state === 'play' || state === 'tutorial')) c.translate(randInt(-shake.mag, shake.mag), randInt(-shake.mag, shake.mag));
  if (state === 'loading') {
    c.fillStyle = PAL.N; c.fillRect(0, 0, VW, VH);
    drawWord(loadError ? 'ERROR' : 'LOADING...', VW / 2, VH / 2 - 8, 2, loadError ? PAL.R : PAL.W, 'center', c);
    if (loadError) drawLines('PUT ESQUIMAL_SHEET_1X.PNG\nNEXT TO INDEX.HTML', VW / 2, VH / 2 + 16, 1, PAL.L);
  } else if (state === 'title') drawTitle(c);
  else if (state === 'achievements') drawAchievements(c);
  else if (state === 'modes') drawModes(c);
  else if (state === 'shop') drawShop(c);
  else if (state === 'gameover') drawGameOver(c);
  else { // countdown, play, pause, tutorial
    drawWorld(c);
    drawLevelSign(c);
    drawHUD(c);
    drawAlerts(c);
    drawErrorFlash(c);
    if (state === 'tutorial') { drawTutorialCaption(c); for (const b of uiButtons) drawButton(c, b); }
    if (state === 'countdown') drawCountdown(c);
    if (state === 'play') drawGo(c);
    if (state === 'pause') drawPause(c);
  }
  c.restore();
  if (state !== 'loading') drawToasts(c);
  drawTransition(c);
  // al canvas visible
  ctx.fillStyle = PAL.N; ctx.fillRect(0, 0, SW, SH);
  ctx.drawImage(off, 0, 0, VW, VH, offX, offY, gameW, gameH);
  if (state !== 'loading') drawControlsPanel();
}
function frame(ts) {
  requestAnimationFrame(frame);
  const raw = lastTs ? (ts - lastTs) / 1000 : 1 / 60; lastTs = ts;
  fps = fps * 0.95 + (1 / Math.max(raw, 0.001)) * 0.05;
  const dt = Math.min(raw, 1 / 30);
  update(dt); render();
}

// Pausa automática al perder el foco
function onHide() {
  if (state === 'play') pauseGame();
  stopMusic();
  for (const k in keys) keys[k] = false; pointers.clear(); for (const k in touchBtn) touchBtn[k] = false; syncInput();
  if (actx && actx.state === 'running') actx.suspend();
}
function onShow() {
  if (actx && actx.state === 'suspended') actx.resume();
  if (state === 'title') startMusic();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) onHide(); else onShow(); });
window.addEventListener('blur', onHide);
window.addEventListener('focus', onShow);
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

// Inicio
loadSave();
resize();
requestAnimationFrame(frame);
loadAssets().then(() => { resize(); enterTitle(); }).catch((e) => { loadError = e; console.warn(e.message); });
</script>
